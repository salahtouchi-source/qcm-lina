<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina — Contrôle mathématiques 4e</title><style>body{margin:0;background:linear-gradient(130deg,#e8eeff,#f9eaff);font:18px system-ui;color:#172345;padding:18px}main{max-width:700px;margin:20px auto;background:white;padding:26px;border-radius:24px;box-shadow:0 12px 40px #26356b22}h1{font-size:26px}button{display:block;width:100%;margin:12px 0;padding:17px;border-radius:13px;border:1px solid #b5c4e9;background:#f5f7ff;font-size:17px;text-align:left;cursor:pointer}button:disabled{opacity:.75}button.good{background:#baf4cf;animation:pop .4s}button.bad{background:#ffd7d7;animation:shake .3s}#start,#next{background:#345fe1;color:white;text-align:center;font-weight:700}#next[hidden],#start[hidden]{display:none}#feedback{min-height:48px;font-weight:600}#bar{height:12px;border-radius:20px;background:#e7ebfa;overflow:hidden}#fill{height:100%;background:#5c6de9;width:0;transition:width .4s}small{color:#68738a}@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body><main><h1>🌟 Lina — Maths 4e</h1><p>Fractions et proportionnalité • 30 questions • Note sur 20</p><div id="bar"><div id="fill"></div></div><p id="progress"></p><h2 id="question">Prête pour ton contrôle ? 💪</h2><div id="answers"></div><p id="feedback"></p><button id="start" onclick="startQuiz()">🚀 Commencer</button><button id="next" hidden onclick="nextQuestion()">Suivant →</button><p id="status"></p><small>Une seule bonne réponse du premier coup rapporte un point. En cas d'erreur, tu peux réessayer pour apprendre. Résultats transmis via le système Gmail configuré.</small></main><script>const questions=[["Quelle fraction est égale à 3/4 ?",["6/8","6/7","9/16"],0,"On multiplie numérateur et dénominateur par 2."],["Simplifier 18/24.",["3/4","6/8","9/12"],0,"Diviser les deux termes par 6."],["Comparer 2/3 et 3/4.",["2/3 < 3/4","2/3 > 3/4","Égales"],0,"8/12 < 9/12."],["Calculer 3/8 + 2/8.",["5/8","5/16","6/8"],0,"Même dénominateur : additionner les numérateurs."],["Calculer 1/2 + 1/3.",["5/6","2/5","2/6"],0,"3/6 + 2/6 = 5/6."],["Calculer 5/6 − 1/4.",["7/12","4/2","1/2"],0,"10/12 − 3/12 = 7/12."],["Calculer 3/7 − 4/5.",["−13/35","13/35","−1/2"],0,"15/35 − 28/35 = −13/35."],["Calculer −2/3 + 1/6.",["−1/2","−3/9","−5/6"],0,"−4/6 + 1/6 = −3/6."],["Calculer 2/3 × 4/5.",["8/15","6/8","8/8"],0,"Multiplier numérateurs et dénominateurs."],["Calculer −3/7 × 14/9.",["−2/3","2/3","−42/16"],0,"−42/63 = −2/3."],["Quel est le signe de (−5/8) × (−2/3) ?",["Positif","Négatif","Nul"],0,"Deux nombres négatifs donnent un produit positif."],["Calculer 3 × 2/7.",["6/7","5/7","6/21"],0,"3 = 3/1."],["Quel est l'inverse de 5/7 ?",["7/5","−5/7","5/7"],0,"On échange numérateur et dénominateur."],["Quel nombre n'a pas d'inverse ?",["0","1","−2"],0,"Aucun nombre multiplié par 0 ne donne 1."],["Calculer 3/4 ÷ 2/5.",["15/8","6/20","5/6"],0,"3/4 × 5/2 = 15/8."],["Calculer −2/3 ÷ 4/9.",["−3/2","−8/27","3/2"],0,"−2/3 × 9/4 = −18/12."],["Calculer 1/2 + 3/4 × 2/3.",["1","5/6","7/6"],0,"La multiplication vaut 1/2, puis on additionne."],["Calculer (1/2 + 3/4) × 2/3.",["5/6","1","7/6"],0,"Dans les parenthèses : 5/4, puis × 2/3."],["Calculer 5/6 − 1/3 ÷ 2/5.",["0","1/2","5/12"],0,"1/3 ÷ 2/5 = 5/6."],["Calculer 3/4 ÷ (1/2 + 1/4).",["1","3/8","9/16"],0,"Parenthèses = 3/4, donc quotient = 1."],["Dans un tableau de proportionnalité, le coefficient est...",["Constant","Variable à chaque ligne","Toujours égal à 1"],0,"On multiplie par le même coefficient."],["Une situation proportionnelle est représentée par...",["Une droite passant par l'origine","Une courbe","Toute droite"],0,"Alignement et passage par l'origine."],["Une droite passant par (0;2) traduit-elle une proportionnalité ?",["Non","Oui","Toujours"],0,"Elle ne passe pas par l'origine (0;0)."],["À 60 km/h, quelle distance en 1,5 h ?",["90 km","60 km","120 km"],0,"d = 60 × 1,5 = 90 km."],["À 60 km/h, quelle distance en 0,5 h ?",["30 km","120 km","15 km"],0,"60 × 0,5 = 30."],["Un rectangle mesure 6 cm × 9 cm. Sa largeur devient 10 cm. Nouvelle longueur ?",["15 cm","13 cm","18 cm"],0,"Coefficient = 10/6 ; 9 × 10/6 = 15."],["Quel est le coefficient de cet agrandissement ?",["5/3","3/5","4"],0,"10/6 = 5/3."],["Si k = 0,6, il s'agit...",["D'une réduction","D'un agrandissement","D'aucun changement"],0,"0 < k < 1 signifie réduction."],["Si k = 1,4, il s'agit...",["D'un agrandissement","D'une réduction","D'aucun changement"],0,"k > 1 signifie agrandissement."],["Pour garder la forme d'un rectangle agrandi, il faut...",["Multiplier toutes les longueurs par le même nombre","Ajouter 4 cm à chaque côté","Modifier seulement la largeur"],0,"Les longueurs correspondantes ont le même coefficient."]];const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let index=0,score=0,first=true,answered=false,errors=[],started=0;const el=id=>document.getElementById(id);function startQuiz(){el("start").hidden=true;started=Date.now();render()}function render(){first=true;answered=false;el("fill").style.width=(index/questions.length*100)+"%";el("progress").textContent="Question "+(index+1)+" / "+questions.length;el("question").textContent=questions[index][0];el("feedback").textContent="";el("next").hidden=true;el("answers").innerHTML="";const opts=questions[index][1].map((t,i)=>({t,i}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}opts.forEach(o=>{let b=document.createElement("button");b.textContent=o.t;b.onclick=()=>choose(b,o.i);el("answers").appendChild(b)})}function choose(b,c){if(answered||b.disabled)return;const item=questions[index];if(c===item[2]){answered=true;b.className="good";if(first)score++;el("feedback").textContent="🎉 Bravo ! "+item[3];el("answers").querySelectorAll("button").forEach(x=>x.disabled=true);el("next").hidden=false;el("next").textContent=index===questions.length-1?"🏆 Voir mon résultat":"Question suivante →"}else{if(first)errors.push({question:item[0],reponseDonnee:item[1][c],reponse:item[1][item[2]],explication:item[3]});first=false;b.disabled=true;b.className="bad";el("feedback").textContent="💪 Essaie encore ! Indice : "+item[3]}}function nextQuestion(){index++;if(index<questions.length)return render();el("fill").style.width="100%";el("progress").textContent="Contrôle terminé";el("question").textContent="🏆 "+(score*20/questions.length).toFixed(2).replace(".",",")+" / 20";el("answers").innerHTML="";el("feedback").textContent="Bravo Lina ! "+score+" bonnes réponses du premier coup sur "+questions.length+".";el("next").hidden=true;const payload={id:"lina_maths_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),matiere:"Mathématiques 4e — Fractions et proportionnalité",eleve:"Lina",destinataire:"salah.touchi@gmail.com",note:Number((score*20/questions.length).toFixed(2)),total:20,bonnesReponses:score,nombreQuestions:questions.length,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};el("status").textContent="📨 Transmission des résultats en cours…";fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>el("status").textContent="📧 Demande d'envoi transmise. Vérifier Gmail : la réception ne peut pas être confirmée depuis cette page.").catch(()=>el("status").textContent="⚠️ Envoi impossible. Vérifier la connexion et contacter le responsable.")}</script></body></html>
