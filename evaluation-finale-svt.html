<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évaluation finale SVT 4e — Lina</title><style>body{font:17px system-ui;background:#f0f5ff;color:#16213b;margin:0;padding:18px}main{max-width:760px;margin:auto;background:white;border-radius:22px;padding:26px;box-shadow:0 10px 30px #2334}h1{font-size:1.7rem}button{cursor:pointer;font:inherit;border-radius:14px;border:2px solid #c6d3e9;padding:15px;background:white;color:#152644}button:hover{border-color:#586ff0}.primary{background:#3757d5;color:white;border:0}.answers{display:grid;gap:12px;margin:22px 0}.right{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626;animation:shake .35s}.hidden{display:none}.feedback{min-height:48px;font-weight:700}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-30px;font-size:25px;animation:fall 1.6s forwards}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}.muted{color:#59677b}.review{padding:12px;border-bottom:1px solid #ddd}progress{width:100%;height:16px}#next{width:100%}@media(prefers-reduced-motion:reduce){.piece,.wrong{animation:none}}</style></head><body><div id="confetti"></div><main><h1>🌍 Évaluation finale de SVT — Lina</h1><div id="intro"><p>💪 30 questions pour être prête demain, inchallah !</p><p><b>Consigne :</b> choisis une réponse. Si tu te trompes, essaie encore : seule la première tentative compte pour la note.</p><p>⏱️ Durée conseillée : 30 minutes. Sans consulter le cours.</p><button class="primary" onclick="start()">Commencer mon contrôle ✨</button></div><div id="quiz" class="hidden"><p id="counter" class="muted"></p><progress id="bar" max="30" value="0"></progress><p id="topic" class="muted"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" onclick="next()" disabled>Question suivante →</button></div><div id="result" class="hidden"></div></main><script>const bank=[{"q":"La Terre est une planète…","a":["tellurique","gazeuse","étoile"],"why":"La Terre est une planète rocheuse, dite tellurique.","topic":"La Terre"},{"q":"La Terre tourne autour…","a":["du Soleil","de la Lune","de Mars"],"why":"La Terre effectue sa révolution autour du Soleil.","topic":"La Terre"},{"q":"La forme globale de la Terre est proche…","a":["d'une sphère légèrement aplatie","d'un disque plat","d'un cube"],"why":"La Terre est globalement sphérique, légèrement aplatie aux pôles.","topic":"La Terre"},{"q":"La couche rigide externe de la Terre s'appelle…","a":["la lithosphère","le noyau externe","l'atmosphère"],"why":"La lithosphère est formée de la croûte et de la partie supérieure rigide du manteau.","topic":"Plaques tectoniques"},{"q":"Sous la lithosphère se trouve notamment…","a":["l'asthénosphère","la stratosphère","l'hydrosphère"],"why":"L'asthénosphère est une partie du manteau qui se déforme lentement.","topic":"Plaques tectoniques"},{"q":"Les plaques tectoniques sont des morceaux…","a":["de lithosphère","de noyau","d'atmosphère"],"why":"Les plaques sont des fragments rigides de lithosphère.","topic":"Plaques tectoniques"},{"q":"Les plaques tectoniques…","a":["se déplacent très lentement","restent immobiles","se déplacent de 100 km par jour"],"why":"Elles se déplacent généralement de quelques centimètres par an.","topic":"Plaques tectoniques"},{"q":"Une divergence correspond à des plaques qui…","a":["s'écartent","se rapprochent","ne bougent jamais"],"why":"À une limite divergente, les plaques s'éloignent.","topic":"Plaques tectoniques"},{"q":"Une convergence correspond à des plaques qui…","a":["se rapprochent","s'écartent","s'arrêtent"],"why":"À une limite convergente, les plaques se rapprochent.","topic":"Plaques tectoniques"},{"q":"Une dorsale océanique se trouve généralement…","a":["à une limite divergente","au centre du noyau","au milieu d'un continent immobile"],"why":"La dorsale est une chaîne sous-marine associée à l'écartement des plaques.","topic":"Plaques tectoniques"},{"q":"En zone de subduction, une plaque…","a":["plonge sous une autre","s'évapore","devient de l'air"],"why":"Une plaque lithosphérique s'enfonce sous une autre.","topic":"Plaques tectoniques"},{"q":"La collision de deux continents peut former…","a":["une chaîne de montagnes","un océan instantanément","un cyclone"],"why":"La collision épaissit et déforme la croûte continentale.","topic":"Plaques tectoniques"},{"q":"Un séisme est provoqué par…","a":["une rupture brutale de roches en profondeur","la rotation quotidienne de la Terre","la pluie"],"why":"Les contraintes accumulées peuvent provoquer une rupture sur une faille.","topic":"Séismes"},{"q":"Le foyer d'un séisme est…","a":["le lieu de rupture en profondeur","le sommet d'un volcan","une station météo"],"why":"Le foyer, ou hypocentre, est le point de départ de la rupture.","topic":"Séismes"},{"q":"L'épicentre est…","a":["le point de surface à la verticale du foyer","le centre de la Terre","le point le plus profond de l'océan"],"why":"L'épicentre se situe à la surface, au-dessus du foyer.","topic":"Séismes"},{"q":"Les ondes sismiques…","a":["propagent les vibrations du séisme","sont des courants marins","créent la pluie"],"why":"Les ondes sismiques transportent l'énergie libérée.","topic":"Séismes"},{"q":"Un sismomètre sert à…","a":["enregistrer les mouvements du sol","mesurer la pluie","observer les étoiles"],"why":"Le sismomètre enregistre les vibrations du sol.","topic":"Séismes"},{"q":"Une faille est…","a":["une fracture des roches avec déplacement possible","une couche de nuages","une rivière"],"why":"Les séismes surviennent souvent lors du mouvement brutal sur une faille.","topic":"Séismes"},{"q":"Les séismes sont surtout fréquents…","a":["aux limites des plaques","uniformément partout","uniquement aux pôles"],"why":"La plupart des séismes se concentrent près des limites des plaques.","topic":"Séismes"},{"q":"Le magma est…","a":["de la roche fondue en profondeur","de l'eau bouillante","de la lave solidifiée uniquement"],"why":"Le magma est de la matière rocheuse partiellement ou totalement fondue en profondeur.","topic":"Volcanisme"},{"q":"Quand le magma atteint la surface, on l'appelle…","a":["lave","granite","vapeur d'eau"],"why":"La lave est le magma arrivé à la surface.","topic":"Volcanisme"},{"q":"Un volcan effusif produit souvent…","a":["des coulées de lave fluides","uniquement de la neige","aucune lave"],"why":"Les éruptions effusives sont dominées par l'écoulement de lave.","topic":"Volcanisme"},{"q":"Un volcan explosif peut projeter…","a":["des cendres et des blocs","des glaçons","des feuilles"],"why":"Les éruptions explosives peuvent produire cendres, gaz et projections.","topic":"Volcanisme"},{"q":"Une nuée ardente est…","a":["un mélange brûlant de gaz, cendres et débris","une pluie ordinaire","un courant marin"],"why":"Une nuée ardente est très chaude et dangereuse.","topic":"Volcanisme"},{"q":"Les volcans et séismes sont souvent alignés car…","a":["ils suivent les limites de plaques","ils suivent les frontières des pays","ils sont répartis au hasard"],"why":"Leur répartition révèle les frontières des plaques.","topic":"Volcanisme"},{"q":"Le risque naturel dépend notamment…","a":["de l'aléa et des enjeux exposés","uniquement de la météo","uniquement du nombre de volcans"],"why":"Un phénomène dangereux devient un risque pour les personnes et les biens exposés.","topic":"Risques naturels"},{"q":"Un aléa sismique désigne…","a":["la possibilité d'un séisme dans une zone","le nombre de touristes","la couleur des roches"],"why":"L'aléa décrit un phénomène potentiellement dangereux.","topic":"Risques naturels"},{"q":"Un bâtiment parasismique vise à…","a":["réduire les dommages lors d'un séisme","empêcher tout séisme","arrêter les plaques"],"why":"Les règles de construction limitent les conséquences, pas les séismes.","topic":"Risques naturels"},{"q":"Lors d'un séisme à l'intérieur, il faut généralement…","a":["se protéger sous un meuble solide et loin des vitres","courir vers les fenêtres","prendre l'ascenseur"],"why":"Se protéger, s'éloigner des vitres et suivre les consignes locales.","topic":"Risques naturels"},{"q":"Les scientifiques peuvent-ils prévoir exactement la date d'un séisme ?","a":["non","oui, toujours à la minute","oui, grâce à la météo"],"why":"On peut évaluer des risques, pas prévoir précisément chaque séisme.","topic":"Risques naturels"}];let questions=[],i=0,points=0,first=true,done=false,errors=[];function start(){questions=bank.map(x=>({...x,choices:[...x.a].sort(()=>Math.random()-.5)})).sort(()=>Math.random()-.5);document.getElementById("intro").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");show()}function show(){let x=questions[i];first=true;done=false;document.getElementById("counter").textContent="Question "+(i+1)+" / "+questions.length;document.getElementById("bar").value=i;document.getElementById("topic").textContent=x.topic;document.getElementById("question").textContent=x.q;document.getElementById("feedback").textContent="";document.getElementById("next").disabled=true;let area=document.getElementById("answers");area.innerHTML="";x.choices.forEach(answer=>{let b=document.createElement("button");b.textContent=answer;b.onclick=()=>respond(b,answer);area.appendChild(b)})}function celebrate(){let area=document.getElementById("confetti");area.innerHTML="";for(let k=0;k<25;k++){let p=document.createElement("span");p.className="piece";p.textContent=["🎉","✨","⭐","🌟"][k%4];p.style.left=(Math.random()*96)+"%";p.style.animationDelay=(Math.random()*.35)+"s";area.appendChild(p)}setTimeout(()=>area.innerHTML="",2000)}function respond(b,answer){if(done||b.disabled)return;let x=questions[i];if(answer===x.a[0]){done=true;if(first)points++;b.classList.add("right");document.getElementById("feedback").textContent=first?"🎉 Bravo Lina ! Réponse parfaite !":"🌟 Bravo, tu as persévéré !";celebrate();document.getElementById("next").disabled=false;document.querySelectorAll("#answers button").forEach(v=>v.disabled=true)}else{if(first)errors.push(x);first=false;b.classList.add("wrong");b.disabled=true;document.getElementById("feedback").textContent="💪 Tu peux le faire ! Essaie une autre réponse."}}function next(){i++;if(i<questions.length)show();else finish()}function finish(){document.getElementById("quiz").classList.add("hidden");let el=document.getElementById("result");el.classList.remove("hidden");let note=(20*points/questions.length).toFixed(1);let h=document.createElement("h2");h.textContent="🏆 Résultat : "+note+" / 20";el.appendChild(h);let p=document.createElement("p");p.textContent=points+" bonnes réponses du premier coup sur "+questions.length+".";el.appendChild(p);let t=document.createElement("h3");t.textContent="📖 Corrections et explications";el.appendChild(t);if(!errors.length){let a=document.createElement("p");a.textContent="🌟 Sans faute ! Félicitations !";el.appendChild(a)}errors.forEach(x=>{let d=document.createElement("div");d.className="review";let b=document.createElement("b");b.textContent=x.q;let p=document.createElement("p");p.textContent="✅ "+x.a[0]+" — "+x.why;d.append(b,p);el.appendChild(d)});let restart=document.createElement("button");restart.className="primary";restart.textContent="🔄 Refaire l'évaluation";restart.onclick=()=>location.reload();el.appendChild(restart)}</script></body></html>
