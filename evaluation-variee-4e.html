<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina — Évaluation variée physique-chimie 4e</title><style>body{background:#eff4ff;font:17px system-ui;color:#19314f;margin:0;padding:16px}main{max-width:730px;margin:auto}section{background:white;padding:24px;border-radius:20px;box-shadow:0 5px 20px #dce4f4}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #bacce9;border-radius:12px;padding:13px;background:#f3f7ff;margin:6px}button.primary{background:#286bd5;color:white;width:100%;border:0}button.selected{background:#cbdfff;border:2px solid #286bd5}input,select{padding:12px;border:1px solid #bacce9;border-radius:10px;width:95%;box-sizing:border-box;margin:8px 0}#msg{font-weight:bold;min-height:30px}#progress{color:#546d8e}.hidden{display:none}.good{color:#167a3c}.bad{color:#a12b35}</style></head><body><main><h1>🌟 Évaluation de Lina — Physique-chimie 4e</h1><section id="intro"><p>10 exercices variés : vrai/faux, associations et mots à compléter.</p><p>Note sur 20. Chaque exercice vaut 2 points. Correction à la fin.</p><button class="primary" onclick="start()">🚀 Commencer l'évaluation</button></section><section id="exam" class="hidden"><p id="progress"></p><h2 id="prompt"></h2><div id="control"></div><p id="msg"></p><button class="primary" onclick="validate()">Valider ma réponse</button></section><section id="end" class="hidden"></section></main><script>
const tasks=[
{type:"tf",q:"Dans un solide, les molécules sont serrées et restent proches les unes des autres.",a:"Vrai",why:"Les molécules d'un solide sont rapprochées et liées."},
{type:"word",q:"Quel gaz représente environ 80 % de l'air ? Écris son nom.",a:"diazote",why:"L'air contient environ 78 % de diazote."},
{type:"tf",q:"Un gaz possède une forme propre et ne peut pas être comprimé.",a:"Faux",why:"Un gaz prend la forme du récipient et il est compressible."},
{type:"match",q:"Associe l'état liquide à la bonne propriété.",opts:["Forme propre","Prend la forme du récipient","Occupe toujours tout l'espace"],a:"Prend la forme du récipient",why:"Un liquide n'a pas de forme propre, mais conserve son volume."},
{type:"word",q:"Comment appelle-t-on le passage de l'état solide à l'état liquide ?",a:"fusion",why:"La fusion est le passage du solide au liquide."},
{type:"tf",q:"Lorsqu'une glace fond, les molécules d'eau deviennent des molécules différentes.",a:"Faux",why:"Les molécules d'eau restent les mêmes pendant le changement d'état."},
{type:"match",q:"Associe le dioxygène à son rôle.",opts:["Permet les combustions","Représente 80 % de l'air","Est le seul gaz de l'air"],a:"Permet les combustions",why:"Le dioxygène est nécessaire à la plupart des combustions courantes."},
{type:"word",q:"Comment appelle-t-on une matière constituée d'une seule espèce chimique ? (Deux mots)",a:"corps pur",why:"Un corps pur est constitué d'une seule espèce chimique."},
{type:"tf",q:"Les molécules d'un gaz sont généralement plus espacées que celles d'un liquide.",a:"Vrai",why:"À l'état gazeux, les molécules sont très espacées."},
{type:"match",q:"Associe le mélange à sa définition.",opts:["Une seule espèce chimique","Plusieurs espèces chimiques","Aucune particule"],a:"Plusieurs espèces chimiques",why:"Un mélange contient plusieurs espèces chimiques."}
];let i=0,score=0,answers=[],choice="",started=0;
function start(){started=Date.now();document.getElementById("intro").classList.add("hidden");document.getElementById("exam").classList.remove("hidden");show();}
function show(){const t=tasks[i];choice="";document.getElementById("progress").textContent="Exercice "+(i+1)+" / "+tasks.length+" • "+(i*10)+" %";document.getElementById("prompt").textContent=t.q;document.getElementById("msg").textContent="";const c=document.getElementById("control");c.innerHTML="";if(t.type==="word"){const input=document.createElement("input");input.id="response";input.placeholder="Écris ta réponse ici";input.autocomplete="off";c.appendChild(input);}else{const opts=t.type==="tf"?["Vrai","Faux"]:t.opts;opts.forEach(v=>{const b=document.createElement("button");b.textContent=v;b.onclick=()=>{choice=v;c.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");};c.appendChild(b);});}}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ")}
function validate(){const t=tasks[i];const given=t.type==="word"?document.getElementById("response").value:choice;if(!given.trim()){document.getElementById("msg").textContent="Choisis ou écris une réponse.";return;}const ok=norm(given)===norm(t.a);if(ok)score+=2;answers.push({q:t.q,given,correct:t.a,ok,why:t.why});i++;if(i<tasks.length)show();else finish();}
function finish(){document.getElementById("exam").classList.add("hidden");const e=document.getElementById("end");e.classList.remove("hidden");const title=document.createElement("h2");title.textContent="🏆 Résultat : "+score+" / 20";e.appendChild(title);const cheer=document.createElement("p");cheer.textContent=score===20?"🎉 Parfait Lina !":score>=14?"🌟 Très bon travail !":"💪 Continue tes efforts, Lina !";e.appendChild(cheer);const h=document.createElement("h3");h.textContent="Correction détaillée";e.appendChild(h);answers.forEach((a,j)=>{const p=document.createElement("p");p.className=a.ok?"good":"bad";p.textContent=(j+1)+". "+(a.ok?"✓ ":"✗ ")+a.q+" — Ta réponse : "+a.given+" — Réponse attendue : "+a.correct+". "+a.why;e.appendChild(p)});const status=document.createElement("p");status.textContent="📨 Transmission du résultat en cours…";e.appendChild(status);const retry=document.createElement("button");retry.textContent="🔄 Recommencer";retry.onclick=()=>location.reload();e.appendChild(retry);const payload={id:"lina_"+Date.now()+"_"+Math.random().toString(36).slice(2,12),matiere:"Physique-chimie",note:score,total:20,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:answers.filter(a=>!a.ok).map(a=>({question:a.q,reponse:a.correct}))};fetch("https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec",{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>status.textContent="📧 Demande d'envoi transmise. Vérifie Gmail (réception non confirmée).").catch(()=>status.textContent="⚠️ Échec de transmission, vérifie la connexion.");}
</script></body></html>
