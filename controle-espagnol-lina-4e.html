<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espagnol 4e – Contrôle Lina</title><style>body{font:17px system-ui;background:#f0f5ff;color:#192a44;padding:16px}main{max-width:700px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 8px 35px #ccd6eb}button{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #cbd6ed;background:#f6f9ff;border-radius:12px;font:inherit;cursor:pointer}button.good{background:#c8f5d6}button.bad{background:#ffd8dc}#next,#start{background:#285dd4;color:white}small{color:#63738d}#feedback{min-height:28px;font-weight:600}</style></head><body><main><h1>🇪🇸 Contrôle d'espagnol – Lina</h1><p>4e · Vocabulaire, santé et pretérito perfecto · 30 questions · Note sur 20</p><small>Une seule tentative par question compte pour la note. Après une erreur, tu peux réessayer pour apprendre !</small><h2 id="question">¿Lista para empezar? 🌟</h2><p id="progress"></p><div id="answers"></div><p id="feedback"></p><button id="start" onclick="start()">🚀 Commencer</button><button id="next" hidden onclick="advance()">Continuer →</button><p id="status"></p></main><script>
const questions=[["Que signifie « la comida sana » ?",["La nourriture saine","La malbouffe","Le sport"],0],["« La comida basura » signifie…",["Le petit déjeuner","La malbouffe","Le repas sain"],1],["« Desarrollar » signifie…",["Développer","Dormir","Manger"],0],["« El desarrollo » signifie…",["La maladie","Le développement","La santé"],1],["« Tener buena salud » signifie…",["Être en bonne santé","Avoir faim","Être fatigué"],0],["« Malo para la salud » signifie…",["Bon pour la santé","Mauvais pour la santé","Prendre soin"],1],["« Cuidarse » signifie…",["Se soigner / prendre soin de soi","Grossir","Se coucher"],0],["« Nutrirse » signifie…",["Se nourrir","Voyager","Lire"],0],["« Un síntoma » signifie…",["Un symptôme","Un remède","Une blessure"],0],["« La tos » signifie…",["La fièvre","La toux","La grippe"],1],["« Una herida » signifie…",["Une blessure","Une maladie","Un comprimé"],0],["« Un esguince » signifie…",["Une entorse","Une allergie","Un rhume"],0],["« Estar constipado » signifie…",["Être enrhumé","Être constipé","Être fatigué"],0],["« Comer cinco frutas y verduras al día » conseille de…",["Manger cinq fruits et légumes par jour","Manger cinq gâteaux","Ne pas manger de légumes"],0],["« No comer grasa » signifie…",["Manger gras","Ne pas manger gras","Ne pas dormir"],1],["Le passé composé se construit avec…",["Haber + participe passé","Ser + infinitif","Tener + infinitif"],0],["Complète : Yo ___ comido.",["has","he","ha"],1],["Complète : Tú ___ viajado.",["has","han","hemos"],0],["Complète : Nosotros ___ leído.",["hemos","habéis","han"],0],["Quel est le participe passé de « hacer » ?",["Hacido","Hecho","Haciendo"],1],["Quel est le participe passé de « decir » ?",["Dicho","Decido","Diciendo"],0],["Quel est le participe passé de « ver » ?",["Visto","Vido","Viendo"],0],["Quel est le participe passé de « escribir » ?",["Escribido","Escrito","Escribiendo"],1],["Quel est le participe passé de « volver » ?",["Volvido","Vuelto","Volviendo"],1],["Quel est le participe passé de « poner » ?",["Ponido","Puesto","Poniendo"],1],["Quel est le participe passé de « romper » ?",["Rompido","Roto","Rompiendo"],1],["Quel est le participe passé de « abrir » ?",["Abrido","Abierto","Abriendo"],1],["Quel est le participe passé de « morir » ?",["Morido","Muerto","Moriendo"],1],["Quel est le participe passé de « resolver » ?",["Resolvido","Resuelto","Resolviendo"],1],["Complète : Ellos ___ escuchado.",["han","ha","habéis"],0]];const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let i=0,score=0,first=true,done=false,errors=[],started=0;
function start(){started=Date.now();document.getElementById('start').hidden=true;render()}
function render(){first=true;done=false;document.getElementById('next').hidden=true;document.getElementById('feedback').textContent='';document.getElementById('progress').textContent='Question '+(i+1)+' / '+questions.length;document.getElementById('question').textContent=questions[i][0];const a=document.getElementById('answers');a.replaceChildren();questions[i][1].map((t,j)=>({t,j})).sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.textContent=o.t;b.onclick=()=>choose(b,o.j);a.appendChild(b)})}
function choose(b,j){if(done||b.disabled)return;const q=questions[i];if(j===q[2]){done=true;b.className='good';if(first)score++;document.getElementById('feedback').textContent='🎉 ¡Muy bien!';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);const n=document.getElementById('next');n.hidden=false;n.textContent=i===questions.length-1?'🏆 Voir ma note':'Question suivante →'}else{if(first)errors.push({question:q[0],reponseDonnee:q[1][j],reponse:q[1][q[2]]});first=false;b.className='bad';b.disabled=true;document.getElementById('feedback').textContent='💪 Essaie encore !'}}function advance(){i++;if(i<questions.length){render();return}finish()}
function finish(){const note=Math.round(score/questions.length*200)/10;document.getElementById('question').textContent='🏆 '+note.toLocaleString('fr-FR')+' / 20';document.getElementById('progress').textContent=score+' bonnes réponses du premier coup sur '+questions.length;document.getElementById('answers').replaceChildren();document.getElementById('feedback').textContent=note>=16?'🌟 ¡Excelente!': '👏 Bravo Lina, continue à réviser !';document.getElementById('next').hidden=true;const payload={id:'lina_esp_'+Date.now()+'_'+Math.random().toString(36).slice(2),matiere:'Espagnol 4e – santé et passé composé',note,total:20,bonnesReponses:score,nombreQuestions:questions.length,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};const s=document.getElementById('status');s.textContent='📨 Transmission du résultat…';fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>s.textContent='📧 Demande de transmission envoyée (réception Gmail non vérifiable depuis cette page).').catch(()=>s.textContent='⚠️ Transmission impossible : vérifie la connexion.')}
</script></body></html>
