<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina – Le Passeur – Contrôle complet</title><style>body{font:17px system-ui;background:#edf2fa;color:#1a2c45;margin:0;padding:15px}main{max-width:720px;margin:auto;background:white;border-radius:20px;padding:22px}button{font:inherit;cursor:pointer;padding:15px;border-radius:12px;border:1px solid #b7c9df;background:#f4f8ff;color:#172d50}#answers button{display:block;width:100%;text-align:left;margin:9px 0}.good{background:#bdf5d1!important;animation:pop .35s}.bad{background:#ffd9d9!important;animation:shake .35s}.primary{background:#2563eb;color:white;width:100%;margin-top:14px}#progress{color:#526782}#feedback{font-weight:600;min-height:30px}@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){.good,.bad{animation:none}}</style></head><body><main><h1>📚 Le Passeur – Lina</h1><p>Contrôle complet · 40 questions · Note /20</p><p id="progress">Prête ?</p><h2 id="question">Lis attentivement chaque question. Une erreur ne rapporte aucun point, même si tu réussis au deuxième essai.</h2><div id="answers"></div><p id="feedback" role="status"></p><button id="next" class="primary" hidden>Question suivante →</button><button id="start" class="primary">🚀 Commencer</button><div id="status"></div></main><script>
const questions=[{"q":"Quel âge Jonas va-t-il avoir lors de la cérémonie ?","answers":["10 ans","11 ans","12 ans","13 ans"],"correct":2},{"q":"Quel sentiment Jonas éprouve-t-il avant la cérémonie ?","answers":["Colère","Appréhension","Indifférence","Jalousie"],"correct":1},{"q":"Quel métier exerce le père de Jonas ?","answers":["Instructeur","Nourricier","Directeur","Passeur"],"correct":1},{"q":"Quelle fonction occupe la mère de Jonas ?","answers":["Département de la Justice","Nourricière","Chef des Anciens","Soignante"],"correct":0},{"q":"Comment s'appelle la sœur de Jonas ?","answers":["Fiona","Lily","Rosemary","Asher"],"correct":1},{"q":"Quelle règle concerne les sentiments familiaux ?","answers":["Ils sont interdits","Ils sont partagés chaque soir","Ils sont écrits","Ils sont confiés au Passeur"],"correct":1},{"q":"Comment les conjoints sont-ils choisis ?","answers":["Par amour","Par les parents","Par le Comité des Anciens","Par hasard"],"correct":2},{"q":"Quelle cérémonie attribue les fonctions ?","answers":["Celle des Neuf","Celle des Douze","Celle des Sept","Celle des Dix"],"correct":1},{"q":"Pourquoi Jonas est-il sauté à la cérémonie ?","answers":["Il est puni","Il est sélectionné exceptionnellement","Il est absent","Il refuse"],"correct":1},{"q":"Quelle fonction Jonas reçoit-il ?","answers":["Chef","Nourricier","Dépositaire de la Mémoire","Instructeur"],"correct":2},{"q":"Quel trait Jonas partage-t-il avec Gabriel ?","answers":["Cheveux roux","Yeux clairs","Cicatrice","Grande taille"],"correct":1},{"q":"Quel phénomène Jonas observe-t-il avec la pomme ?","answers":["Elle change brièvement d'apparence","Elle disparaît","Elle grossit","Elle parle"],"correct":0},{"q":"Quelle règle spéciale Jonas reçoit-il ?","answers":["Il doit mentir","Il peut mentir","Il doit se taire toujours","Il peut partir"],"correct":1},{"q":"Quelle règle concerne sa formation ?","answers":["Aucune question","Demander sa libération","Ne pas en parler","Former Asher"],"correct":2},{"q":"Quel est le premier souvenir reçu ?","answers":["Incendie","Traîneau sur la neige","Guerre","Fête"],"correct":1},{"q":"Pourquoi la neige n'existe-t-elle plus ?","answers":["Catastrophe","Contrôle du climat","Pollution","Sécheresse"],"correct":1},{"q":"Quelle couleur Jonas voit-il d'abord ?","answers":["Bleu","Vert","Rouge","Jaune"],"correct":2},{"q":"Que signifie l'Identique ?","answers":["Même salaire","Suppression des différences et choix","Partage des souvenirs","Même métier"],"correct":1},{"q":"Pourquoi les habitants ne voient-ils pas les couleurs ?","answers":["Ils sont aveugles","La société a supprimé cette perception","Lunettes","Aucune couleur n'existe"],"correct":1},{"q":"Quel souvenir douloureux Jonas reçoit-il ?","answers":["Jambe brisée","Chute d'avion","Noyade","Brûlure"],"correct":0},{"q":"Pourquoi conserver les souvenirs ?","answers":["Divertir","Conseiller grâce au passé","Écrire les lois","Contrôler les naissances"],"correct":1},{"q":"Que découvre Jonas grâce au souvenir de Noël ?","answers":["Haine","Amour familial","Jalousie","Peur"],"correct":1},{"q":"Que répondent ses parents au sujet de l'amour ?","answers":["Ils disent oui","Ils jugent le mot imprécis","Ils se fâchent","Ils se taisent"],"correct":1},{"q":"Pourquoi les habitants prennent-ils des pilules ?","answers":["Dormir","Supprimer les pulsions","Mémoriser","Voir les couleurs"],"correct":1},{"q":"Pourquoi Jonas arrête-t-il ses pilules ?","answers":["Il les perd","Pour retrouver ses émotions","Ordre du Passeur","Maladie"],"correct":1},{"q":"Que découvre Jonas dans la guerre ?","answers":["Une fête","Violence et mort","Un sport","Une dispute"],"correct":1},{"q":"Qui était Rosemary ?","answers":["Mère de Jonas","Ancienne apprentie du Passeur","Chef","Inventrice"],"correct":1},{"q":"Après la libération de Rosemary, que se passe-t-il ?","answers":["Ses souvenirs reviennent aux habitants","Tous disparaissent","Le Passeur part","Les lois changent"],"correct":0},{"q":"Quel lien unit Rosemary au Passeur ?","answers":["Sœur","Fille","Mère","Épouse"],"correct":1},{"q":"Que signifie réellement la libération ?","answers":["Voyager","Changer de travail","Être mis à mort","Être récompensé"],"correct":2},{"q":"Comment Jonas découvre-t-il la vérité ?","answers":["Enregistrement vidéo","Asher","Lettre","Lily"],"correct":0},{"q":"Que fait le père au plus léger des jumeaux ?","answers":["Il le confie","Injection mortelle","Il le soigne","Il le cache"],"correct":1},{"q":"Pourquoi Gabriel risque-t-il la libération ?","answers":["Faute","Difficultés de développement et de sommeil","Âge","Refus de manger"],"correct":1},{"q":"Comment Jonas apaise-t-il Gabriel ?","answers":["Souvenirs agréables","Médicaments","Chanson","Oubli"],"correct":0},{"q":"Pourquoi Jonas part-il plus tôt ?","answers":["Gabriel va être libéré","Formation terminée","Dénonciation","Mort du Passeur"],"correct":0},{"q":"Pourquoi le Passeur reste-t-il ?","answers":["Il ne peut marcher","Aider les habitants avec les souvenirs","Il a peur","Il doit remplacer le père"],"correct":1},{"q":"Comment Jonas s'enfuit-il ?","answers":["Voiture","Bateau","Vélo","Train"],"correct":2},{"q":"Quels dangers rencontrent-ils ?","answers":["Faim froid épuisement","Animaux seulement","Guerre","Inondation"],"correct":0},{"q":"Que retrouve Jonas à la fin ?","answers":["Traîneau et colline enneigée","Avion","Maison familiale","Cérémonie"],"correct":0},{"q":"Pourquoi la fin est-elle ambiguë ?","answers":["Le refuge reste incertain","Jonas rentre","Gabriel devient Passeur","Tout était un rêve"],"correct":0}];
const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";
let index=0,score=0,first=true,answered=false,errors=[],started=0;
const el=id=>document.getElementById(id);
el("start").onclick=()=>{started=Date.now();el("start").hidden=true;render()};
function render(){first=true;answered=false;el("progress").textContent="Question "+(index+1)+" / "+questions.length;el("question").textContent=questions[index].q;el("feedback").textContent="";el("next").hidden=true;el("answers").innerHTML="";const opts=questions[index].answers.map((text,i)=>({text,i}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}opts.forEach(o=>{const b=document.createElement("button");b.textContent=o.text;b.onclick=()=>choose(b,o.i);el("answers").appendChild(b)})}
function choose(btn,choice){if(answered||btn.disabled)return;const item=questions[index];if(choice===item.correct){answered=true;btn.className="good";if(first)score++;el("feedback").textContent=first?"🎉 Bravo Lina !":"🌟 Bien joué, tu as trouvé !";el("answers").querySelectorAll("button").forEach(b=>b.disabled=true);el("next").hidden=false;el("next").textContent=index===questions.length-1?"🏆 Voir mon résultat":"Question suivante →"}else{if(first){errors.push({question:item.q,reponseDonnee:item.answers[choice],reponse:item.answers[item.correct],numero:index+1})}first=false;btn.disabled=true;btn.className="bad";el("feedback").textContent="💪 Essaie encore, tu peux y arriver !"}}
el("next").onclick=()=>{index++;if(index<questions.length){render();return}finish()};
function finish(){el("progress").textContent="Contrôle terminé";el("question").textContent="🏆 Note : "+(score/2).toLocaleString("fr-FR")+" / 20 ("+score+"/40)";el("answers").innerHTML="";el("next").hidden=true;el("feedback").textContent=score>=36?"🌟 Excellent Lina !":"Bravo pour tes efforts !";const payload={id:"lina_passeur_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),matiere:"Français - Le Passeur - Lois Lowry",eleve:"Lina",note:score/2,total:20,bonnesReponses:score,nombreQuestions:40,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};el("status").textContent="📨 Transmission du résultat en cours…";fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>el("status").textContent="📧 Demande envoyée. Réception Gmail à vérifier (non confirmable depuis la page).").catch(()=>{el("status").textContent="⚠️ Échec de l'envoi. Copie de secours ci-dessous.";const b=document.createElement("button");b.textContent="Copier les résultats";b.onclick=()=>navigator.clipboard.writeText(JSON.stringify(payload,null,2));el("status").appendChild(b)})}
</script></body></html>
