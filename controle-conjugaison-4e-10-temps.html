<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina — Contrôle conjugaison 4e</title><style>body{font:18px system-ui,Arial;background:#edf3ff;color:#192d4b;margin:0;padding:18px}main{max-width:720px;margin:auto;background:white;padding:24px;border-radius:20px;box-shadow:0 5px 25px #d3ddec}h1{font-size:1.7rem}button{width:100%;padding:16px;margin:9px 0;border:1px solid #b8cbe8;border-radius:12px;background:#f3f7ff;color:#192d4b;font:inherit;cursor:pointer;text-align:left}button:disabled{opacity:.65}button.primary{background:#2865d4;color:white;text-align:center;font-weight:bold}.right{background:#c9f5d5}.wrong{background:#ffdedb;animation:shake .35s}#feedback{min-height:28px;font-weight:600}#progress{color:#536782}#spark{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-30px;animation:fall 1.6s forwards}@keyframes fall{to{transform:translateY(110vh) rotate(480deg);opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){.confetti,.wrong{animation:none}}</style></head><body><div id="spark"></div><main><h1>📚 Lina — Contrôle de conjugaison</h1><p>Français · 4e · 20 questions · 10 temps de la fiche</p><p id="progress">Prête pour le contrôle ?</p><h2 id="question">Tu peux réessayer en cas d'erreur. Seule ta première réponse compte pour la note.</h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="start">🚀 Commencer</button><button class="primary" id="next" hidden>Question suivante →</button><div id="status" role="status"></div></main><script>const questions=[["Quel est le temps de « Je marche » ?",["Présent","Imparfait","Futur"],0],["Quel est le temps de « Elle tombait » ?",["Passé simple","Imparfait","Présent"],1],["Quel est le temps de « Je marchai » ?",["Passé simple","Passé composé","Imparfait"],0],["Quel est le temps de « Elle tombera » ?",["Futur","Conditionnel","Présent"],0],["Quel est le temps de « Je marcherais » ?",["Futur","Conditionnel","Imparfait"],1],["Quel est le temps de « J'ai marché » ?",["Passé composé","Plus-que-parfait","Passé antérieur"],0],["Quel est le temps de « Elle était tombée » ?",["Passé composé","Plus-que-parfait","Futur antérieur"],1],["Quel est le temps de « J'eus marché » ?",["Passé antérieur","Passé simple","Plus-que-parfait"],0],["Quel est le temps de « Elle sera tombée » ?",["Futur antérieur","Futur","Conditionnel passé"],0],["Quel est le temps de « J'aurais marché » ?",["Conditionnel passé","Futur antérieur","Passé composé"],0],["Comment forme-t-on le passé composé ?",["Auxiliaire au présent + participe passé","Auxiliaire à l'imparfait + participe passé","Verbe au futur"],0],["Comment forme-t-on le plus-que-parfait ?",["Auxiliaire au futur + participe passé","Auxiliaire à l'imparfait + participe passé","Auxiliaire au présent + participe passé"],1],["Comment forme-t-on le passé antérieur ?",["Auxiliaire au passé simple + participe passé","Auxiliaire au présent + participe passé","Verbe à l'imparfait"],0],["Comment forme-t-on le futur antérieur ?",["Auxiliaire au futur + participe passé","Auxiliaire au conditionnel + participe passé","Auxiliaire à l'imparfait + participe passé"],0],["Comment forme-t-on le conditionnel passé ?",["Auxiliaire au conditionnel + participe passé","Auxiliaire au passé simple + participe passé","Auxiliaire au présent + participe passé"],0],["Quelle phrase est au passé composé ?",["Elle est tombée","Elle tombait","Elle tombera"],0],["Quelle phrase est au plus-que-parfait ?",["J'ai marché","J'avais marché","J'aurai marché"],1],["Quelle phrase est au passé antérieur ?",["Elle fut tombée","Elle était tombée","Elle sera tombée"],0],["Quelle phrase est au futur antérieur ?",["J'aurais marché","J'aurai marché","J'avais marché"],1],["Quelle phrase est au conditionnel passé ?",["Elle serait tombée","Elle sera tombée","Elle est tombée"],0]];const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let idx=0,score=0,first=true,done=false,errors=[],started=0,lastPayload=null;const $=id=>document.getElementById(id);$('start').onclick=()=>{started=Date.now();$('start').hidden=true;show()};$('next').onclick=()=>{idx++;if(idx<questions.length)show();else finish()};function show(){first=true;done=false;$('next').hidden=true;$('feedback').textContent='';$('progress').textContent='Question '+(idx+1)+' / '+questions.length;$('question').textContent=questions[idx][0];$('answers').innerHTML='';let opts=questions[idx][1].map((t,i)=>({t,i}));for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}opts.forEach(o=>{let b=document.createElement('button');b.textContent=o.t;b.onclick=()=>choose(b,o.i);$('answers').appendChild(b)})}function choose(b,i){if(done||b.disabled)return;let q=questions[idx];if(i===q[2]){done=true;b.classList.add('right');if(first)score++;$('feedback').textContent=first?'🎉 Bravo Lina !':'🌟 Bien joué, tu as trouvé !';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);$('next').hidden=false;$('next').textContent=idx===questions.length-1?'🏆 Voir mon résultat':'Question suivante →';celebrate()}else{if(first)errors.push({question:q[0],reponse:q[1][q[2]]});first=false;b.disabled=true;b.classList.add('wrong');$('feedback').textContent='💪 Essaie encore, tu vas y arriver !'}}function celebrate(){let c=$('spark');c.innerHTML='';for(let i=0;i<16;i++){let s=document.createElement('span');s.className='confetti';s.textContent=['⭐','✨','🎉'][i%3];s.style.left=(Math.random()*95)+'%';s.style.animationDelay=(Math.random()*.3)+'s';c.appendChild(s)}setTimeout(()=>c.innerHTML='',1900)}function finish(){$('progress').textContent='Contrôle terminé';$('question').textContent='🏆 Note : '+score+' / 20';$('answers').innerHTML='';$('next').hidden=true;$('feedback').textContent=score>=16?'🌟 Excellent travail Lina !':'💪 Bravo pour tes efforts, continue !';lastPayload={id:'lina_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),matiere:'Français - Conjugaison 4e - 10 temps',note:score,total:20,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};let b=document.createElement('button');b.className='primary';b.textContent='📨 Réessayer la transmission du résultat';b.onclick=send;$('answers').appendChild(b);send()}async function send(){$('status').textContent='📨 Transmission du résultat en cours…';try{await fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastPayload)});$('status').textContent='📧 Demande envoyée. Vérifie Gmail : la réception ne peut pas être confirmée depuis cette page.'}catch(e){$('status').textContent='⚠️ Envoi impossible. Vérifie la connexion puis réessaie.'}}</script></body></html>
