<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVT – Lina</title><style>body{font:18px system-ui;background:#eef5fa;color:#17334a;max-width:650px;margin:30px auto;padding:18px}main{background:white;border-radius:20px;padding:24px}button{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #aac;border-radius:12px;background:#f1f6ff;font:inherit}button:disabled{opacity:.8}.ok{color:green}.bad{color:#b33} @keyframes pop{50%{transform:scale(1.05)}} .ok,.bad{animation:pop .4s}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}.bad{animation:shake .4s}.conf{position:fixed;top:-20px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:10}progress{width:100%;accent-color:#16a085}button:active{transform:scale(.97)}</style><main><h1>SVT – Tectonique des plaques</h1><div id="app"></div></main><script>const q=[["Divergence","Écartement","Rapprochement"],["Relief divergent","Dorsale","Fosse"],["Roche formée à la dorsale","Basalte","Calcaire"],["Volcanisme des dorsales","Effusif","Explosif"],["Âge des basaltes loin de la dorsale","Plus ancien","Plus jeune"],["Convergence","Rapprochement","Écartement"],["Densité océanique","3,3","3"],["Épaisseur océanique du cours","70 km","130 km"],["Épaisseur continentale du cours","130 km","70 km"],["Plaque qui plonge sous le continent","Océanique","Continentale"],["Relief de subduction","Fosse","Dorsale"],["Exemple de subduction","Nazca et sud-américaine","Indienne et eurasiatique"],["Relief de collision","Chaîne de montagnes","Dorsale"],["Exemple de collision","Indienne et eurasiatique","Nazca et sud-américaine"],["Déformations de collision","Plis et cassures","Coulées de lave"],["Formation du plancher océanique","Dorsale","Fosse"],["Matériau où se produisent les séismes","Rigide","Liquide"],["Origine du séisme","Cassure des roches","Refroidissement de l'eau"],["Point en surface à la verticale du foyer","Épicentre","Dorsale"],["Pourquoi les basaltes s'éloignent-ils ?","Les plaques divergent","Les plaques convergent"]];let i=0,s=0;const app=document.getElementById('app');let missed=false;function celebrate(){for(let k=0;k<35;k++){let e=document.createElement('span');e.className='conf';e.textContent=['🎉','⭐','✨','💚'][k%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}function show(){missed=false;if(i===q.length){celebrate();app.innerHTML='<h2>🏆 Résultat : '+s+'/20</h2><p>Bravo pour ton travail !</p><button onclick="location.reload()">Recommencer</button>';return}let [t,c,w]=q[i];app.innerHTML='<progress max=20 value='+i+'></progress><p>Question '+(i+1)+'/20 · Score : '+s+'</p><h2>'+t+'</h2>';for(const a of (Math.random()<.5?[c,w]:[w,c])){let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(a!==c){missed=true;b.disabled=true;b.style.background='#ffe5e5';let p=document.createElement('p');p.className='bad';p.textContent='💪 Courage Lina, tu peux y arriver ! Réessaie.';app.append(p);return}app.querySelectorAll('button').forEach(x=>x.disabled=true);b.style.background='#d6f7df';if(!missed)s++;celebrate();let p=document.createElement('p');p.className=a===c?'ok':'bad';p.textContent=a===c?['Bravo Lina ! 🎉','Super, continue ! ⭐','Excellent travail ! 🏆','Tu progresses ! 💚'][i%4]:'Courage ! Bonne réponse : '+c;app.append(p);let n=document.createElement('button');n.textContent='Suivant';n.onclick=()=>{i++;show()};app.append(n)};app.append(b)}}show()</script></html>
