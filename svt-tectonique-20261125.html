<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVT – Lina</title><style>body{font:18px system-ui;background:#eef5fa;color:#17334a;max-width:650px;margin:30px auto;padding:18px}main{background:white;border-radius:20px;padding:24px}button{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #aac;border-radius:12px;background:#f1f6ff;font:inherit}button:disabled{opacity:.8}.ok{color:green}.bad{color:#b33} @keyframes pop{50%{transform:scale(1.05)}} .ok,.bad{animation:pop .4s}</style><main><h1>SVT – Tectonique des plaques</h1><div id="app"></div></main><script>const q=[["Divergence","Écartement","Rapprochement"],["Relief divergent","Dorsale","Fosse"],["Roche formée à la dorsale","Basalte","Calcaire"],["Volcanisme des dorsales","Effusif","Explosif"],["Âge des basaltes loin de la dorsale","Plus ancien","Plus jeune"],["Convergence","Rapprochement","Écartement"],["Densité océanique","3,3","3"],["Épaisseur océanique du cours","70 km","130 km"],["Épaisseur continentale du cours","130 km","70 km"],["Plaque qui plonge sous le continent","Océanique","Continentale"],["Relief de subduction","Fosse","Dorsale"],["Exemple de subduction","Nazca et sud-américaine","Indienne et eurasiatique"],["Relief de collision","Chaîne de montagnes","Dorsale"],["Exemple de collision","Indienne et eurasiatique","Nazca et sud-américaine"],["Déformations de collision","Plis et cassures","Coulées de lave"],["Formation du plancher océanique","Dorsale","Fosse"],["Matériau où se produisent les séismes","Rigide","Liquide"],["Origine du séisme","Cassure des roches","Refroidissement de l'eau"],["Point en surface à la verticale du foyer","Épicentre","Dorsale"],["Pourquoi les basaltes s'éloignent-ils ?","Les plaques divergent","Les plaques convergent"]];let i=0,s=0;const app=document.getElementById('app');function show(){if(i===q.length){app.innerHTML='<h2>Résultat : '+s+'/20</h2><p>Bravo pour ton travail !</p><button onclick="location.reload()">Recommencer</button>';return}let [t,c,w]=q[i];app.innerHTML='<p>Question '+(i+1)+'/20</p><h2>'+t+'</h2>';for(const a of (Math.random()<.5?[c,w]:[w,c])){let b=document.createElement('button');b.textContent=a;b.onclick=()=>{app.querySelectorAll('button').forEach(x=>x.disabled=true);if(a===c)s++;let p=document.createElement('p');p.className=a===c?'ok':'bad';p.textContent=a===c?'Bravo ! 🎉':'Courage ! Bonne réponse : '+c;app.append(p);let n=document.createElement('button');n.textContent='Suivant';n.onclick=()=>{i++;show()};app.append(n)};app.append(b)}}show()</script></html>
