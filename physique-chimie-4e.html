<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle physique-chimie Lina 4e</title><style>body{font:18px system-ui;background:#f1f5fc;color:#172c48;margin:0}main{max-width:760px;margin:auto;padding:20px}section{background:white;border-radius:20px;padding:25px;box-shadow:0 6px 20px #d3dcea}button{display:block;width:100%;padding:15px;margin:10px 0;border:2px solid #d4dfef;border-radius:13px;background:#f4f8ff;color:#172c48;font:inherit;text-align:left;cursor:pointer}button:disabled{opacity:.6}#next,#start{background:#2869d6;color:white;text-align:center}#feedback{font-weight:700;min-height:40px}#progress{color:#506c8e}.good{background:#d5f8df!important}.bad{background:#ffe0e0!important;animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.hidden{display:none}#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;top:-30px;animation:fall 1.6s linear forwards;font-size:26px}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}</style><main><h1>🧪 Contrôle de Lina — Physique-chimie 4e</h1><p>20 questions • Note sur 20 • Matière, molécules et air</p><section id="intro"><p>Chaque bonne réponse rapporte un point. En cas d'erreur, réessaie : seule la première réponse compte pour la note. Courage Lina ! 🌟</p><button id="start" onclick="begin()">Commencer le contrôle 🚀</button></section><section id="quiz" class="hidden"><p id="progress"></p><h2 id="question"></h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" disabled onclick="advance()">Question suivante ➜</button></section><section id="result" class="hidden"></section></main><div id="stars"></div><script>const Q=[["La plus petite particule d'eau étudiée dans ce cours est…","Une molécule d'eau","Une goutte","Un grain de sable"],["Un corps pur contient…","Une seule sorte de molécules","Deux sortes de molécules","Aucune molécule"],["Un mélange contient…","Plusieurs sortes de molécules","Une seule sorte de molécules","Uniquement de l'eau"],["Dans le modèle, les molécules d'une même substance…","Gardent leurs propriétés de taille et de masse","Grossissent à la fusion","Disparaissent à l'évaporation"],["Entre les molécules, il existe…","Des espaces vides","Toujours de l'air","Du sable"],["À l'état solide, les molécules sont…","Serrées et liées","Très espacées","Libres de quitter le solide"],["Un solide possède…","Une forme propre","La forme de tout récipient","Un volume toujours variable"],["Un solide est généralement…","Incompressible","Très compressible","Expansible"],["À l'état liquide, les molécules…","Glissent les unes sur les autres","Sont immobiles","Sont très éloignées"],["Un liquide…","Prend la forme du récipient","A toujours une forme propre","Occupe tout l'espace disponible"],["La surface d'un liquide au repos est…","Plane et horizontale","Toujours inclinée","Toujours arrondie"],["Un liquide est…","Pratiquement incompressible","Très compressible","Toujours expansible"],["Dans un gaz, les molécules sont…","Très espacées et agitées","Serrées et immobiles","Liées entre elles"],["Un gaz est…","Compressible","Toujours incompressible","De forme propre"],["Un gaz dans un récipient fermé…","Occupe tout l'espace disponible","Reste seulement au fond","Ne peut pas bouger"],["Lorsqu'on passe de glace à eau liquide, les molécules d'eau…","Restent les mêmes","Deviennent d'autres molécules","Disparaissent"],["Les deux gaz principaux de l'air sont…","Diazote et dioxygène","Hydrogène et hélium","Dioxyde de carbone et argon"],["L'air contient environ…","80 % de diazote","80 % de dioxygène","50 % de dioxygène"],["L'air contient environ…","20 % de dioxygène","1 % de dioxygène","90 % de dioxygène"],["Le gaz qui permet les combustions est…","Le dioxygène","Le diazote","L'argon"]];let i=0,score=0,first=true,done=false,errors=[];function begin(){document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){first=true;done=false;document.getElementById('progress').textContent='Question '+(i+1)+' / '+Q.length;document.getElementById('question').textContent=Q[i][0];document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;const a=document.getElementById('answers');a.innerHTML='';let opts=Q[i].slice(1).map((s,j)=>({s,ok:j===0})).sort(()=>Math.random()-.5);opts.forEach(o=>{let b=document.createElement('button');b.textContent=o.s;b.onclick=()=>answer(b,o.ok);a.appendChild(b)})}function answer(b,ok){if(done)return;if(ok){b.classList.add('good');if(first)score++;done=true;document.getElementById('feedback').textContent=first?'🎉 Bravo Lina ! Bonne réponse !':'💪 Bien joué, tu as trouvé !';document.getElementById('next').disabled=false;document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);celebrate()}else{if(first)errors.push({q:Q[i][0],a:Q[i][1]});first=false;b.disabled=true;b.classList.add('bad');document.getElementById('feedback').textContent='🌈 Pas grave, réessaie ! Tu peux y arriver !'}}function celebrate(){const box=document.getElementById('stars');for(let n=0;n<12;n++){const e=document.createElement('span');e.className='star';e.textContent=['⭐','✨','🎉','💖'][n%4];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.3+'s';box.appendChild(e);setTimeout(()=>e.remove(),2100)}}function advance(){i++;if(i<Q.length)render();else{document.getElementById('quiz').classList.add('hidden');let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h2>🏆 Résultat : '+score+' / 20</h2><p>'+(score>=16?'Excellent travail Lina ! 🌟':score>=10?'Bon travail, continue tes efforts ! 💪':'Tu progresses à chaque essai, courage ! 💖')+'</p><h3>Corrections des erreurs</h3>'+ (errors.length?errors.map(x=>'<p><strong>'+x.q+'</strong><br>✅ '+x.a+'</p>').join(''):'<p>Tout est juste, félicitations !</p>')+'<button id="start" onclick="location.reload()">Recommencer 🔄</button>';celebrate()}}</script></html>
