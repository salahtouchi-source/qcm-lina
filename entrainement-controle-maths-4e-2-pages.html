<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina - Entraînement contrôle 4e</title><style>body{background:#f0efff;font:18px system-ui;margin:0;padding:18px;color:#19233e}main{max-width:680px;margin:18px auto;padding:25px;background:white;border-radius:24px;box-shadow:0 10px 35px #26317a20}h1{font-size:25px}button{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid #c2c9e3;border-radius:13px;background:#f5f7ff;font:inherit;text-align:left;cursor:pointer}button.good{background:#baf0c7;animation:pop .4s}button.bad{background:#ffd6d6;animation:shake .3s}button:disabled{opacity:.75}#start,#next{background:#385cda;color:white;text-align:center;font-weight:700}button[hidden]{display:none!important}#track{height:12px;background:#e8eaf4;border-radius:15px;overflow:hidden}#fill{height:100%;width:0;background:#5c73ea;transition:width .4s}#feedback{min-height:48px;font-weight:600}small{color:#626d84}@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body><main><h1>🌟 Lina — Entraînement maths 4e</h1><p>Exclusivement les 2 pages « Entraînement pour le contrôle » • 30 questions • Note /20</p><div id="track"><div id="fill"></div></div><p id="progress"></p><h2 id="question">Prête pour le contrôle ? 💪</h2><div id="answers"></div><p id="feedback"></p><button id="start" onclick="start()">🚀 Commencer</button><button id="next" hidden onclick="next()">Question suivante →</button><p id="status"></p><small>La première réponse compte pour la note. Après une erreur, réessaie pour comprendre. Envoi des résultats via le système déjà configuré.</small></main><script>const questions=[["Complète : 3/5 = ?/20",["12","15","8"],0,"5 × 4 = 20, donc 3 × 4 = 12."],["Simplifie 24/36 au maximum.",["2/3","4/6","6/9"],0,"Divise 24 et 36 par 12."],["Compare 3/4 et 2/3.",["3/4 > 2/3","3/4 < 2/3","Égales"],0,"9/12 > 8/12."],["Calcule 2/3 + 1/6.",["5/6","3/9","1/2"],0,"4/6 + 1/6 = 5/6."],["Calcule 3/4 − 1/2.",["1/4","2/2","1/2"],0,"3/4 − 2/4 = 1/4."],["Calcule −1/2 + 1/4.",["−1/4","−3/4","1/4"],0,"−2/4 + 1/4 = −1/4."],["Calcule (−2/3) × (3/4).",["−1/2","1/2","−6/7"],0,"−6/12 = −1/2."],["29 est-il premier ?",["Oui","Non","Seulement pair"],0,"29 a exactement deux diviseurs positifs : 1 et 29."],["Quel est un diviseur de 45 autre que 1 et 45 ?",["5","7","8"],0,"45 = 5 × 9."],["Quelle est la décomposition de 90 en facteurs premiers ?",["2 × 3² × 5","2 × 45","9 × 10"],0,"90 = 2 × 3 × 3 × 5."],["Quelle est la décomposition de 180 en facteurs premiers ?",["2² × 3² × 5","2 × 90","18 × 10"],0,"180 = 2 × 2 × 3 × 3 × 5."],["Pourquoi 72 = 2 × 36 n'est-il pas une décomposition terminée ?",["36 n'est pas premier","2 n'est pas premier","72 est premier"],0,"Chaque facteur doit être premier."],["Quelle est la décomposition complète de 72 ?",["2³ × 3²","2 × 36","8 × 9"],0,"72 = 2 × 2 × 2 × 3 × 3."],["Quel nombre est premier ?",["31","21","39"],0,"31 n'est divisible que par 1 et 31."],["Quelle égalité vérifie la décomposition de 90 ?",["2 × 9 × 5 = 90","2 × 3 × 5 = 90","3 × 5 × 5 = 90"],0,"2 × 9 × 5 = 90."],["Sur un graphique, une proportionnalité est représentée par...",["Une droite passant par l'origine","Une droite quelconque","Une courbe"],0,"La droite doit passer par (0 ; 0)."],["Des points alignés sur une droite ne passant pas par l'origine : proportionnalité ?",["Non","Oui","Toujours"],0,"L'alignement seul ne suffit pas."],["À 60 km/h, distance parcourue en 0,5 h ?",["30 km","60 km","120 km"],0,"60 × 0,5 = 30."],["À 60 km/h, distance parcourue en 1 h ?",["60 km","30 km","90 km"],0,"60 × 1 = 60."],["À 60 km/h, distance parcourue en 2,5 h ?",["150 km","120 km","180 km"],0,"60 × 2,5 = 150."],["À 60 km/h, durée pour parcourir 180 km ?",["3 h","2 h","4 h"],0,"180 ÷ 60 = 3."],["Dans d = 60 × t, 60 représente...",["Le coefficient de proportionnalité","La durée","La distance"],0,"C'est la vitesse constante en km/h."],["Quelle formule traduit une proportionnalité ?",["y = 3x","y = 3x + 1","y = x + 3"],0,"La forme est y = kx."],["Un rectangle de 4 cm × 7 cm est agrandi avec k = 1,5. Nouvelle largeur ?",["6 cm","5,5 cm","4 cm"],0,"4 × 1,5 = 6."],["Même rectangle agrandi avec k = 1,5. Nouvelle longueur ?",["10,5 cm","8,5 cm","7,5 cm"],0,"7 × 1,5 = 10,5."],["Après réduction de coefficient 0,5, une longueur mesure 8 cm. Longueur initiale ?",["16 cm","4 cm","8,5 cm"],0,"8 ÷ 0,5 = 16."],["Que signifie un coefficient de réduction de 0,5 ?",["Les longueurs sont divisées par 2","On ajoute 0,5 cm","Les longueurs doublent"],0,"Multiplier par 0,5 revient à diviser par 2."],["Calcule 20 % de 150.",["30","20","75"],0,"150 × 20/100 = 30."],["À l'échelle 1 : 200, 1 cm sur le plan représente...",["200 cm en réalité","200 m en réalité","2 cm en réalité"],0,"Une longueur réelle est 200 fois celle du plan."],["À l'échelle 1 : 200, 2,5 cm sur le plan représentent...",["5 m","500 m","50 cm"],0,"2,5 × 200 = 500 cm = 5 m."]],endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let i=0,score=0,first=true,answered=false,errors=[],started=0;const e=id=>document.getElementById(id);function start(){e("start").hidden=true;started=Date.now();render()}function render(){first=true;answered=false;e("fill").style.width=(i/questions.length*100)+"%";e("progress").textContent="Question "+(i+1)+" / "+questions.length;e("question").textContent=questions[i][0];e("feedback").textContent="";e("next").hidden=true;e("answers").innerHTML="";let a=questions[i][1].map((t,j)=>({t,j}));for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}a.forEach(o=>{let b=document.createElement("button");b.textContent=o.t;b.onclick=()=>choose(b,o.j);e("answers").appendChild(b)})}function choose(b,j){if(answered||b.disabled)return;let q=questions[i];if(j===q[2]){answered=true;b.className="good";if(first)score++;e("feedback").textContent="🎉 Bravo Lina ! "+q[3];e("answers").querySelectorAll("button").forEach(x=>x.disabled=true);e("next").hidden=false;e("next").textContent=i===questions.length-1?"🏆 Voir ma note":"Question suivante →"}else{if(first)errors.push({question:q[0],reponseDonnee:q[1][j],reponse:q[1][q[2]],explication:q[3]});first=false;b.className="bad";b.disabled=true;e("feedback").textContent="💪 Essaie encore ! Indice : "+q[3]}}function next(){i++;if(i<questions.length)return render();e("fill").style.width="100%";e("progress").textContent="Terminé";e("question").textContent="🏆 "+(score*20/questions.length).toFixed(2).replace(".",",")+" / 20";e("answers").innerHTML="";e("feedback").textContent="Bravo Lina ! "+score+" bonnes réponses du premier coup sur 30.";e("next").hidden=true;let payload={id:"lina_entrainement_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),matiere:"Mathématiques 4e — Entraînement pour le contrôle (2 pages)",eleve:"Lina",destinataire:"salah.touchi@gmail.com",note:Number((score*20/questions.length).toFixed(2)),total:20,bonnesReponses:score,nombreQuestions:30,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};e("status").textContent="📨 Transmission du résultat…";fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>e("status").textContent="📧 Demande envoyée. Vérifie Gmail : la réception ne peut pas être confirmée ici.").catch(()=>e("status").textContent="⚠️ Échec de la demande d'envoi. Vérifie la connexion.")}</script></body></html>
