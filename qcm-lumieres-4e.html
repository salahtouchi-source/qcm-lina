<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina • QCM Europe des Lumières • 4e</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#18304c;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:20px auto;padding:16px}.hero{background:linear-gradient(125deg,#123f79,#416ed4);color:#fff;border-radius:22px;padding:24px}.hero h1{margin:4px 0}.hero p{margin:6px 0}.card{background:#fff;border-radius:18px;padding:24px;margin-top:16px;box-shadow:0 6px 20px #173c7212}button{cursor:pointer;font:inherit}.option{display:block;width:100%;text-align:left;border:2px solid #d8e3f3;border-radius:12px;background:#fff;padding:14px;margin:10px 0;color:#18304c}.option:hover:not(:disabled){border-color:#477bd3;background:#eef5ff}.option:disabled{cursor:default}.good{border-color:#159b77!important;background:#e7fff3!important}.bad{border-color:#c34d57!important;background:#fff0f1!important}.primary{border:0;background:#225cbb;color:white;border-radius:12px;padding:13px 22px;font-weight:700}.primary:disabled{opacity:.45}.muted{color:#53657b}.feedback{padding:14px;border-radius:12px;background:#ecf5ff;margin-top:14px}.progress{height:12px;border-radius:20px;background:#cbd9ee;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#46d5a4;transition:width .3s}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.celebrate{animation:pop .4s ease}@keyframes pop{0%{transform:scale(.98);opacity:.7}100%{transform:scale(1);opacity:1}}li{margin:10px 0}small{color:#65758a}@media(max-width:500px){.hero,.card{padding:18px}}
</style></head><body><main><div class="hero"><div>📚 HISTOIRE • 4e</div><h1>✨ L'Europe des Lumières</h1><p>Contrôle de Lina • 20 questions • Note sur 20</p><div class="progress"><div id="bar" style="width:0%"></div></div></div><div id="play" class="card"><div class="row"><strong id="counter">Question 1 / 20</strong><span id="score">Note provisoire : 0 / 20</span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div style="text-align:right;margin-top:16px"><button id="next" class="primary hidden">Question suivante →</button></div></div><div id="result" class="card hidden"><h2 id="final"></h2><p id="message"></p><div id="review"></div><button id="restart" class="primary">🔄 Recommencer le contrôle</button></div><p class="muted"><small>Basé uniquement sur le résumé de cours et la fiche réussite du professeur. Hors programme de ce contrôle : introduction Royaume-Uni et partie II « despotisme éclairé ».</small></p></main><script>
const questions=[["À quel siècle se développe le mouvement des Lumières ?",["XVIe siècle","XVIIIe siècle","XXe siècle"],1,"Le XVIIIe siècle est appelé le siècle des Lumières."],["Que signifie « raison » ?",["Obéir sans réfléchir","Réfléchir par soi-même avec esprit critique","Croire toutes les traditions"],1,"La raison permet de réfléchir et de porter un jugement critique."],["Qu'est-ce que le libre arbitre ?",["Agir et penser librement","Appliquer la censure","Obéir au roi"],0,"Le libre arbitre est la faculté de penser et d'agir par soi-même."],["Quelle démarche les savants des Lumières privilégient-ils ?",["La superstition","L'observation et l'expérimentation","La tradition seule"],1,"Ils utilisent la réflexion, l'observation et l'expérience."],["Qu'est-ce qu'une monarchie absolue ?",["Le peuple décide de toutes les lois","Le roi détient tous les pouvoirs","Trois assemblées gouvernent"],1,"Le roi est la seule autorité et détient tous les pouvoirs."],["Quels sont les trois ordres de la société ?",["Rois, juges, soldats","Clergé, noblesse et tiers état","Marchands, savants et artistes"],1,"La société d'ordres distingue clergé, noblesse et tiers état."],["Quels ordres bénéficient de privilèges ?",["Clergé et noblesse","Tiers état uniquement","Tous de façon égale"],0,"Le clergé et la noblesse, environ 3 % de la population, bénéficient de privilèges."],["Quelle égalité est défendue par les Lumières ?",["Égalité devant l'impôt","Privilèges réservés à la noblesse","Suppression de l'éducation"],0,"Les Lumières dénoncent les privilèges et défendent l'égalité devant l'impôt."],["Quel penseur défend la séparation des pouvoirs ?",["Voltaire","Montesquieu","Rousseau"],1,"Montesquieu défend cette idée dans De l'esprit des lois (1748)."],["Quels sont les trois pouvoirs distingués par Montesquieu ?",["Religieux, militaire, commercial","Législatif, exécutif, judiciaire","Royal, noble, populaire"],1,"Faire les lois, les appliquer et rendre la justice."],["Quel ouvrage est associé à Montesquieu ?",["De l'esprit des lois","Émile ou De l'éducation","Traité sur la tolérance"],0,"De l'esprit des lois date de 1748."],["Quel philosophe est associé à l'égalité et à l'éducation dans le résumé ?",["Jean-Jacques Rousseau","Diderot","d'Alembert"],0,"Rousseau : Émile ou De l'éducation, 1762."],["Quel livre de Rousseau est cité ?",["L'Encyclopédie","Émile ou De l'éducation","De l'esprit des lois"],1,"Le résumé cite Émile ou De l'éducation (1762)."],["Quel auteur défend la tolérance religieuse ?",["Voltaire","Montesquieu","d'Alembert"],0,"Voltaire : Traité sur la tolérance, 1763."],["Comment s'appelle l'ouvrage de Voltaire étudié ?",["Traité sur la tolérance","Émile ou De l'éducation","L'Encyclopédie"],0,"Il paraît en 1763."],["Qu'est-ce que la censure ?",["La liberté d'écrire","Le contrôle des textes avant publication","Un café de philosophes"],1,"Une autorité décide si un texte peut être publié."],["Qui dirige l'Encyclopédie étudiée ?",["Voltaire et Rousseau","Diderot et d'Alembert","Louis XIV et Montesquieu"],1,"L'Encyclopédie est dirigée par Diderot et d'Alembert."],["Quand paraît l'Encyclopédie ?",["1751 à 1772","1789 à 1799","1643 à 1715"],0,"Repère historique exigé : 1751–1772."],["Quel est l'objectif de l'Encyclopédie ?",["Rassembler et diffuser les connaissances","Renforcer la censure","Réserver le savoir au roi"],0,"Elle rassemble les connaissances de l'époque dans tous les domaines."],["Comment les idées des Lumières se diffusent-elles ?",["Uniquement par les lois royales","Livres, journaux, cafés, salons, académies et voyages","Seulement dans les églises"],1,"Elles circulent par les écrits, les lieux de discussion et les voyages."]];let i=0,score=0,answers=[];const $=id=>document.getElementById(id);function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){const q=questions[i];$('counter').textContent='Question '+(i+1)+' / 20';$('question').textContent=q[0];$('score').textContent='Note provisoire : '+score+' / 20';$('bar').style.width=(i/20*100)+'%';$('choices').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');q[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>choose(j);$('choices').appendChild(b)})}function choose(j){const q=questions[i];const ok=j===q[2];answers.push(j);if(ok)score++;Array.from($('choices').children).forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');if(k===j&&!ok)b.classList.add('bad')});$('feedback').className='feedback celebrate';$('feedback').textContent=(ok?'🎉 Bravo Lina ! Bonne réponse. ':'💪 Continue Lina ! Tu vas progresser. ')+q[3];$('score').textContent='Note provisoire : '+score+' / 20';$('next').textContent=i===19?'Voir ma note 🏆':'Question suivante →';$('next').classList.remove('hidden')}function finish(){$('play').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('final').textContent='🏆 Note : '+score+' / 20';$('message').textContent=score>=18?'🌟 Excellent travail Lina !':score>=14?'👏 Très bon effort ! Revois les corrections pour viser 20/20.':'💪 Tu peux progresser : relis la fiche puis recommence !';$('review').innerHTML='<h3>Correction des 20 questions</h3><ol>'+questions.map((q,k)=>'<li><strong>'+escapeHtml(q[0])+'</strong><div>Ta réponse : '+escapeHtml(q[1][answers[k]])+(answers[k]===q[2]?' ✅':' ❌')+'</div><div>Bonne réponse : '+escapeHtml(q[1][q[2]])+'</div><small>'+escapeHtml(q[3])+'</small></li>').join('')+'</ol>'} $('next').onclick=()=>{i++;if(i===20)finish();else show()};$('restart').onclick=()=>{i=0;score=0;answers=[];$('result').classList.add('hidden');$('play').classList.remove('hidden');show();scrollTo(0,0)};show();
</script></body></html>
