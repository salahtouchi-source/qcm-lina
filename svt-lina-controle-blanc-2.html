<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVT – Lina</title><style>body{font:18px system-ui;background:#eef5fa;color:#17334a;max-width:650px;margin:30px auto;padding:18px}main{background:white;border-radius:20px;padding:24px}button{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #aac;border-radius:12px;background:#f1f6ff;font:inherit}button:disabled{opacity:.8}.ok{color:green}.bad{color:#b33} @keyframes pop{50%{transform:scale(1.05)}} .ok,.bad{animation:pop .4s}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}.bad{animation:shake .4s}.conf{position:fixed;top:-20px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:10}progress{width:100%;accent-color:#16a085}button:active{transform:scale(.97)}body{background:linear-gradient(145deg,#d9f3ff,#e9e2ff);min-height:100vh;box-sizing:border-box}main{box-shadow:0 12px 45px #33446620}h1{font-size:26px}.welcome{text-align:center}.planet{font-size:76px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.start{background:linear-gradient(110deg,#176b91,#6550b8);color:white;font-weight:bold;border:0;padding:20px}.info{background:#eef5ff;border-radius:14px;padding:14px;line-height:1.7}.welcome h2{font-size:28px}.welcome p{line-height:1.5}</style><main><h1>SVT – Mission 2 : contrôle blanc</h1><div id="app"></div></main><script>const q=[["Dans l'Atlantique, deux plaques s'écartent. Quel relief rechercher ?","Une dorsale océanique","Une fosse océanique"],["Une lave fluide refroidit dans l'eau. Quel produit obtient-on ?","Du basalte","Une chaîne de montagnes"],["Pourquoi le plancher océanique ne présente-t-il pas un vide à la dorsale ?","De nouvelles roches se forment","Les plaques cessent de bouger"],["Le graphique montre des basaltes plus vieux loin de l'axe. Quelle conclusion ?","Le plancher se forme à l'axe puis s'éloigne","Le plancher se forme loin de l'axe"],["Sur le graphique du cours, vers 200 km, quel âge approximatif ?","10 Ma","70 Ma"],["Que représente Ma sur le graphique ?","Millions d'années","Mètres par année"],["Quel mouvement explique la répartition des âges ?","Divergence","Collision"],["Pourquoi parle-t-on de volcanisme effusif à la dorsale ?","La lave est fluide","La lave est toujours solide"],["Nazca et Amérique du Sud se rapprochent. Quelle plaque plonge ?","Nazca","Amérique du Sud"],["Quelle donnée justifie ce plongement ?","3,3 est supérieur à 3","70 km est supérieur à 130 km"],["Des foyers sismiques dessinent un plan incliné sous un continent. Que révèle-t-il ?","Une plaque océanique plongeante","Une dorsale divergente"],["Quel relief est associé à ce plongement ?","Une fosse océanique","Une dorsale"],["Quel devenir pour la lithosphère océanique à cette limite ?","Elle s'enfonce dans l'asthénosphère","Elle forme un nouveau plancher à l'axe"],["Deux plaques continentales se rapprochent. Quel phénomène ?","Collision","Divergence"],["Pourquoi observe-t-on des plis ?","Les roches sont comprimées","Les plaques s'écartent"],["Quel relief résulte de la collision Inde-Eurasie ?","Une chaîne de montagnes","Une fosse océanique"],["Les séismes indiquent la présence de quel type de matériau ?","Rigide","Liquide"],["Quelle succession explique un séisme ?","Pression, cassure, ondes sismiques","Refroidissement, basalte, divergence"],["Sur une carte, les flèches → ← indiquent quoi ?","Une convergence","Une divergence"],["Quel bilan est correct ?","Formation à la dorsale et disparition en subduction","Disparition à la dorsale et formation en subduction"]];let i=0,s=0;const app=document.getElementById('app');let missed=false;function celebrate(){for(let k=0;k<35;k++){let e=document.createElement('span');e.className='conf';e.textContent=['🎉','⭐','✨','💚'][k%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}function show(){missed=false;if(i===q.length){celebrate();app.innerHTML='<h2>🏆 Résultat : '+s+'/20</h2><p>Bravo pour ton travail !</p><button onclick="location.reload()">Recommencer</button>';return}let [t,c,w]=q[i];app.innerHTML='<progress max=20 value='+i+'></progress><p>Question '+(i+1)+'/20 · Score : '+s+'</p><h2>'+t+'</h2>';for(const a of (Math.random()<.5?[c,w]:[w,c])){let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(a!==c){missed=true;b.disabled=true;b.style.background='#ffe5e5';let p=document.createElement('p');p.className='bad';p.textContent='💪 Courage Lina, tu peux y arriver ! Réessaie.';app.append(p);return}app.querySelectorAll('button').forEach(x=>x.disabled=true);b.style.background='#d6f7df';if(!missed)s++;celebrate();let p=document.createElement('p');p.className=a===c?'ok':'bad';p.textContent=a===c?['Bravo Lina ! 🎉','Super, continue ! ⭐','Excellent travail ! 🏆','Tu progresses ! 💚'][i%4]:'Courage ! Bonne réponse : '+c;app.append(p);let n=document.createElement('button');n.textContent='Suivant';n.onclick=()=>{i++;show()};app.append(n)};app.append(b)}}function welcome(){app.innerHTML='<section class="welcome"><div class="planet">🌍</div><h2>Bienvenue Lina !</h2><p>Mission 2 : deviens une experte de la tectonique !</p><div class="info">📚 SVT · Niveau 4ᵉ<br>🎯 20 questions de raisonnement et d’analyse<br>🏆 Objectif : 20/20<br>💡 Tu peux réessayer après chaque erreur.</div><p>Prends ton temps, lis bien chaque question et crois en tes capacités. Chaque erreur est une occasion de progresser !</p><button class="start" onclick="show()">🚀 Je commence mon défi !</button></section>'}welcome()</script></html>
