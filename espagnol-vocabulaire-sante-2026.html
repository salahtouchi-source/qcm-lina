<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lina – Espagnol vocabulaire</title><style>body{font-family:system-ui;background:#f2f3ff;color:#25264a;margin:0;padding:16px}main{max-width:680px;margin:auto;background:white;border-radius:22px;padding:25px;box-shadow:0 10px 30px #20205016}h1{color:#4b3fb7}button{font:inherit;cursor:pointer;border:1px solid #c8c7e9;border-radius:13px;padding:14px;margin:7px 0;background:#f5f4ff;width:100%;text-align:left}button:disabled{cursor:default}button.good{background:#baf2c8}button.bad{background:#ffd1d1}#next,#start{background:#5746c8;color:white;text-align:center;font-weight:bold}#progress{font-weight:700}#feedback{min-height:32px;font-weight:bold}small{color:#555}#report{white-space:pre-wrap}</style></head><body><main><h1>🇪🇸 Lina – Contrôle de vocabulaire</h1><p>40 questions • Note sur 20 • Habitudes saines, santé et corps humain</p><p id="progress"></p><h2 id="question">Prête pour ton contrôle ? 🌟</h2><div id="answers"></div><p id="feedback"></p><button id="start" onclick="start()">🚀 Commencer</button><button id="next" hidden onclick="next()">Continuer →</button><p id="status"></p><div id="report"></div></main><script>const questions=[["Que signifie « la comida sana » ?",["La nourriture saine","Le médecin","Le sport"],0],["« La comida basura » signifie…",["La nourriture saine","La malbouffe","Le petit-déjeuner"],1],["Traduction de « desayunar »",["Dîner","Déjeuner","Prendre le petit-déjeuner"],2],["« El desayuno » est…",["Le petit-déjeuner","Le dîner","Le goûter"],0],["« Comer bien » veut dire…",["Dormir beaucoup","Bien manger","Courir vite"],1],["« Una vida sana » signifie…",["Une vie saine","Une mauvaise habitude","Une maladie"],0],["« Cuidarse » signifie…",["Se blesser","Prendre soin de soi","Se reposer"],1],["« Alimentarse » signifie…",["S'alimenter","Se laver","Se réveiller"],0],["« Hacer deporte » signifie…",["Faire du sport","Faire la cuisine","Faire ses devoirs"],0],["« Los cinco consejos » signifie…",["Les cinq maladies","Les cinq conseils","Les cinq repas"],1],["« Comer cinco frutas y verduras al día » conseille de…",["Manger cinq fruits et légumes par jour","Dormir cinq heures","Boire cinq sodas"],0],["« Un cuerpo sano » signifie…",["Un corps sain","Un esprit sain","Un repas sain"],0],["« Una mente sana » signifie…",["Un médecin","Un esprit sain","Un corps malade"],1],["« Un médico » est…",["Un patient","Un médecin","Un médicament"],1],["« Un paciente » est…",["Un patient","Une ordonnance","Un traitement"],0],["« Las medicinas » sont…",["Les maladies","Les médicaments","Les vitamines"],1],["« Plantas y hierbas medicinales » signifie…",["Des plantes et herbes médicinales","Des fruits secs","Des boissons sucrées"],0],["« Signar » n'est pas le verbe visé : « soñar » signifie…",["Soigner","Rêver","Saigner"],1],["« Un tratamiento » signifie…",["Un traitement","Un cachet","Un hôpital"],0],["« Una pastilla » signifie…",["Un cachet","Une jambe","Un sirop"],0],["« El jarabe » signifie…",["Le sang","Le sirop","Le médecin"],1],["« Descansar » signifie…",["Se reposer","Se dépêcher","Se blesser"],0],["« La fiebre » signifie…",["La fièvre","La toux","La douleur"],0],["« Estar enfermo » signifie…",["Être en bonne santé","Être malade","Être fatigué"],1],["« Un resfriado » signifie…",["Un rhume","Une fracture","Un médicament"],0],["« Tener tos » signifie…",["Avoir de la fièvre","Avoir de la toux","Avoir mal au dos"],1],["« Vomitar » signifie…",["Tousser","Vomir","Se reposer"],1],["« Romperse algo » signifie…",["Se casser quelque chose","Prendre un médicament","Se laver"],0],["« La cabeza » signifie…",["La tête","Le bras","La jambe"],0],["« El estómago » signifie…",["Le dos","L'estomac","Le cou"],1],["« El corazón » signifie…",["Le cœur","Le genou","Le coude"],0],["« La barriga » signifie…",["Le ventre","Le nez","Le pied"],0],["« Los músculos » signifie…",["Les os","Les muscles","Les doigts"],1],["« La garganta » signifie…",["La gorge","La main","La jambe"],0],["« El cuello » signifie…",["Le cou","Le coude","Le genou"],0],["« La muñeca » signifie…",["Le poignet","La cheville","La tête"],0],["« El tobillo » signifie…",["La cheville","Le coude","Le pied"],0],["« El pecho » signifie…",["La poitrine","Le ventre","Le dos"],0],["« El pie » signifie…",["Le pied","La jambe","La main"],0],["« La espalda » signifie…",["Le dos","La tête","Le bras"],0]];const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let index=0,score=0,first=true,answered=false,errors=[],started=0;const $=id=>document.getElementById(id);function start(){started=Date.now();$('start').hidden=true;render()}function render(){first=true;answered=false;$('progress').textContent='Question '+(index+1)+' / '+questions.length;$('question').textContent=questions[index][0];$('feedback').textContent='';$('next').hidden=true;const box=$('answers');box.innerHTML='';questions[index][1].map((s,i)=>({s,i})).sort(()=>Math.random()-.5).forEach(o=>{let b=document.createElement('button');b.textContent=o.s;b.onclick=()=>choose(b,o.i);box.appendChild(b)})}function choose(b,i){if(answered||b.disabled)return;let q=questions[index];if(i===q[2]){answered=true;b.className='good';if(first)score++;$('feedback').textContent='🎉 Bravo ! '+(first?'Bonne réponse du premier coup !':'Tu as trouvé !');document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);$('next').hidden=false;$('next').textContent=index===questions.length-1?'🏆 Terminer':'Question suivante →'}else{if(first)errors.push({question:q[0],reponseDonnee:q[1][i],bonneReponse:q[1][q[2]]});first=false;b.disabled=true;b.className='bad';$('feedback').textContent='💪 Pas encore ! Essaie une autre réponse.'}}function next(){index++;if(index<questions.length)return render();finish()}function finish(){let note=Math.round(score*20/questions.length*100)/100;$('progress').textContent='Contrôle terminé';$('question').textContent='🏆 Résultat : '+note+' / 20';$('answers').innerHTML='';$('feedback').textContent=score+' bonnes réponses du premier coup sur '+questions.length;$('next').hidden=true;const payload={id:'lina_es_vocab_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),matiere:'Espagnol – Vocabulaire santé et corps',eleve:'Lina',note,total:20,bonnesReponses:score,nombreQuestions:questions.length,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};$('report').textContent=errors.length?'À revoir :\n'+errors.map(e=>'• '+e.question+' → '+e.bonneReponse).join('\n'):'Excellent ! Aucune erreur.';$('status').textContent='📨 Transmission du résultat…';fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>$('status').textContent='📧 Demande de transmission envoyée. Vérifier la réception dans Gmail.').catch(()=>$('status').textContent='⚠️ Envoi non confirmé. Vérifier la connexion.')}</script></body></html>
