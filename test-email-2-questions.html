<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test QCM Lina 2 questions</title>
<style>body{font:18px Arial,sans-serif;background:#eef3ff;color:#182c4d;margin:0;padding:22px}main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:20px}button{display:block;width:100%;padding:17px;margin:12px 0;border:1px solid #b9c9e4;border-radius:12px;background:#f4f7ff;font-size:18px;cursor:pointer}button:active{transform:scale(.98)}.good{background:#c9f5d2}.bad{background:#ffe0df}#start,#next{background:#2868d6;color:white}#status{font-size:15px}</style></head>
<body><main><h1>🧪 QCM Lina — Test 2/2</h1><p id="progress">Deux questions • Note sur 2</p><h2 id="question">Prête pour le test ?</h2><div id="answers"></div><p id="feedback"></p><button id="start" onclick="startQuiz()">🚀 Commencer</button><button id="next" hidden onclick="nextQuestion()">Question suivante ➜</button><div id="status"></div></main>
<script>
const questions=[{q:"Un corps pur contient…",answers:["Une seule sorte de molécules","Plusieurs sortes de molécules","Aucune molécule"],correct:0},{q:"L'air contient principalement…",answers:["Du dioxygène et du diazote","Du dioxygène pur","Du dioxyde de carbone pur"],correct:0}];
const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";
let index=0,score=0,first=true,answered=false,errors=[],started=Date.now();
function startQuiz(){document.getElementById("start").hidden=true;started=Date.now();render();}
function render(){first=true;answered=false;document.getElementById("progress").textContent="Question "+(index+1)+" / 2";document.getElementById("question").textContent=questions[index].q;document.getElementById("feedback").textContent="";document.getElementById("next").hidden=true;const box=document.getElementById("answers");box.innerHTML="";const opts=questions[index].answers.map((text,i)=>({text,i}));opts.sort(()=>Math.random()-.5);opts.forEach(opt=>{const btn=document.createElement("button");btn.textContent=opt.text;btn.onclick=()=>choose(btn,opt.i);box.appendChild(btn);});}
function choose(btn,choice){if(answered||btn.disabled)return;const item=questions[index];if(choice===item.correct){answered=true;btn.className="good";if(first)score++;document.getElementById("feedback").textContent="🎉 Bravo Lina !";document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);const next=document.getElementById("next");next.hidden=false;next.textContent=index===1?"🏆 Voir mon résultat":"Question suivante ➜";}else{if(first)errors.push({question:item.q,reponse:item.answers[item.correct]});first=false;btn.disabled=true;btn.className="bad";document.getElementById("feedback").textContent="💪 Essaie encore, tu peux y arriver !";}}
function nextQuestion(){index++;if(index<2){render();return;}document.getElementById("progress").textContent="Contrôle terminé";document.getElementById("question").textContent="🏆 Résultat : "+score+" / 2";document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent=score===2?"🌟 Excellent, 2/2 !":"Bravo pour tes efforts !";document.getElementById("next").hidden=true;const payload={id:"lina_"+Date.now()+"_"+Math.random().toString(36).slice(2,12),matiere:"Physique-chimie",note:score,total:2,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};const status=document.getElementById("status");status.textContent="📨 Transmission du résultat en cours…";fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>{status.textContent="📧 Demande envoyée. Vérifie Gmail (réception non confirmable depuis cette page).";}).catch(()=>{status.textContent="⚠️ Envoi impossible. Vérifie la connexion.";});}
</script></body></html>
