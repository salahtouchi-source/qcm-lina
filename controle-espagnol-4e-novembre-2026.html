<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle espagnol 4e – Lina</title><style>body{margin:0;background:#f1f4ff;color:#20294b;font:17px system-ui}main{max-width:690px;margin:20px auto;background:white;padding:24px;border-radius:20px;box-shadow:0 8px 35px #22336616}h1{font-size:26px}button{display:block;width:100%;padding:15px;margin:10px 0;background:#f7f8ff;border:2px solid #dce2f7;border-radius:12px;font:inherit;text-align:left;cursor:pointer}button:disabled{opacity:.75}button.good{background:#c8f6da;border-color:#3da96a}button.bad{background:#ffe0e0;border-color:#d35b5b}button.primary{background:#4258d4;color:white;text-align:center}#bar{height:10px;background:#e7e9fa;border-radius:20px;overflow:hidden}#fill{height:100%;background:#5b65dc;width:0;transition:width .25s}#feedback{min-height:28px;font-weight:600}#next[hidden],#start[hidden]{display:none}#status{font-size:14px}small{color:#566078}</style></head><body><main><h1>🇪🇸 Contrôle d'espagnol – 4e</h1><p>20 questions · note sur 20 · basé sur les 3 pages du cahier</p><div id="bar"><div id="fill"></div></div><p id="progress">Prête, Lina ?</p><h2 id="question">Pretérito perfecto et vocabulaire de la santé</h2><div id="answers"></div><p id="feedback"></p><button id="start" class="primary" onclick="start()">🚀 Commencer</button><button id="next" class="primary" hidden onclick="advance()">Question suivante →</button><p id="status"></p><small>Une erreur ? Réessaie : seule la première réponse compte pour la note. Le résultat est transmis au système Gmail habituel à la fin.</small></main><script>const qs=[{"q":"¿Cómo se forma el pretérito perfecto?","a":["Haber en presente + participio","Ser + infinitivo","Haber en futuro + infinitivo","Estar + gerundio"],"c":0},{"q":"Completa: Yo ___ comido sano.","a":["he","has","ha","hemos"],"c":0},{"q":"Completa: Tú ___ viajado.","a":["he","has","han","habéis"],"c":1},{"q":"Completa: Ella ___ dormido.","a":["hemos","han","ha","habéis"],"c":2},{"q":"Completa: Nosotros ___ leído.","a":["hemos","habéis","has","han"],"c":0},{"q":"Completa: Vosotros ___ vivido.","a":["han","hemos","habéis","ha"],"c":2},{"q":"Completa: Ellos ___ escuchado.","a":["has","han","he","ha"],"c":1},{"q":"¿Cuál es el participio de «hacer»?","a":["hacido","hecho","hacho","haciendo"],"c":1},{"q":"¿Cuál es el participio de «decir»?","a":["decido","diciendo","dicho","decido"],"c":2},{"q":"¿Cuál es el participio de «ver»?","a":["visto","vido","viendo","veído"],"c":0},{"q":"¿Cuál es el participio de «volver»?","a":["volvido","vuelto","volviendo","volto"],"c":1},{"q":"¿Cuál es el participio de «escribir»?","a":["escribido","escribiendo","escrito","escribo"],"c":2},{"q":"¿Cuál es el participio de «poner»?","a":["ponido","puesto","poniendo","ponesto"],"c":1},{"q":"¿Cuál est le participe passé de «romper» ?","a":["rompido","rompiendo","roto","rompesto"],"c":2},{"q":"«La comida basura» signifie…","a":["la nourriture saine","la malbouffe","le petit déjeuner","la cuisine"],"c":1},{"q":"«El desarrollo» signifie…","a":["le développement","le sommeil","la maladie","le sport"],"c":0},{"q":"«Cuidarse» signifie…","a":["se soigner / prendre soin de soi","se dépêcher","s'endormir","se blesser"],"c":0},{"q":"«Una herida» signifie…","a":["une blessure","une maladie","une douleur","une habitude"],"c":0},{"q":"«Estar cansado» signifie…","a":["être en colère","être fatigué","être malade","être heureux"],"c":1},{"q":"¿Qué significa «comer cinco frutas y verduras al día»?","a":["Manger cinq fruits et légumes par jour","Manger cinq repas par jour","Manger cinq desserts par jour","Manger cinq fruits par semaine"],"c":0}];const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";let i=0,score=0,first=true,done=false,errors=[],started=0;const $=id=>document.getElementById(id);function start(){started=Date.now();$('start').hidden=true;show()}function show(){first=true;done=false;$('progress').textContent='Question '+(i+1)+' / '+qs.length;$('fill').style.width=(i/qs.length*100)+'%';$('question').textContent=qs[i].q;$('feedback').textContent='';$('next').hidden=true;$('answers').replaceChildren();qs[i].a.map((label,j)=>({label,j})).sort(()=>Math.random()-.5).forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.onclick=()=>answer(b,o.j);$('answers').append(b)})}function answer(b,j){if(done||b.disabled)return;const q=qs[i];if(j===q.c){done=true;b.classList.add('good');if(first)score++;$('feedback').textContent='🎉 ¡Muy bien!';document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);$('next').hidden=false;$('next').textContent=i===qs.length-1?'🏆 Voir mon résultat':'Question suivante →'}else{if(first)errors.push({question:q.q,reponseDonnee:q.a[j],bonneReponse:q.a[q.c]});first=false;b.disabled=true;b.classList.add('bad');$('feedback').textContent='💪 ¡Ánimo! Essaie encore.'}}function advance(){i++;if(i<qs.length){show();return}$('fill').style.width='100%';$('progress').textContent='Contrôle terminé';$('question').textContent='🏆 Résultat : '+score+' / 20';$('answers').replaceChildren();$('next').hidden=true;$('feedback').textContent=score>=17?'🌟 ¡Excelente, Lina!':'👏 Bravo Lina, continue tes efforts !';const payload={id:'lina_es_'+Date.now()+'_'+Math.random().toString(36).slice(2),matiere:'Espagnol 4e – pretérito perfecto et santé',note:score,total:20,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};$('status').textContent='📨 Transmission du résultat…';fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>$('status').textContent='📧 Demande d’envoi effectuée. Vérifie la réception dans Gmail.').catch(()=>$('status').textContent='⚠️ Transmission impossible : vérifie la connexion.')}}</script></body></html>
