<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVT Lina — Frontières des plaques</title><style>body{font:18px system-ui;background:#edf5f3;color:#173a37;margin:0;padding:18px}main{max-width:680px;margin:auto;background:white;padding:24px;border-radius:22px;box-shadow:0 8px 28px #1232}button{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #a7c8c0;border-radius:12px;background:#f3faf8;font-size:17px;text-align:left;cursor:pointer}button:disabled{opacity:.75}.good{background:#bdf0c9}.bad{background:#ffd8d5}#start,#next{background:#087f70;color:white;text-align:center}#status{font-size:14px}h1{font-size:25px}</style></head><body><main><h1>🌍 SVT — Lina, 4e</h1><p>Reliefs aux frontières des plaques • 10 questions</p><p id="progress"></p><h2 id="question">Prête pour ton contrôle ?</h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="start" onclick="startQuiz()">🚀 Commencer</button><button id="next" hidden onclick="nextQuestion()">Question suivante ➜</button><p id="status" aria-live="polite"></p></main><script>
const questions=[{"q":"Où se trouvent les dorsales océaniques ?","answers":["Aux limites convergentes","Aux limites divergentes","Au centre des plaques"],"correct":1,"explanation":"Les dorsales sont situées aux limites divergentes."},{"q":"Que font les plaques à une dorsale ?","answers":["Elles se rapprochent","Elles s'immobilisent","Elles s'écartent"],"correct":2,"explanation":"À la dorsale, les plaques s'écartent."},{"q":"Quel volcanisme se produit à l'axe de la dorsale ?","answers":["Effusif","Explosif","Aucun"],"correct":0,"explanation":"Le cours mentionne un volcanisme effusif."},{"q":"Que forme la matière minérale produite ?","answers":["Une fosse","Le plancher océanique","Une vallée continentale"],"correct":1,"explanation":"Elle forme le plancher océanique."},{"q":"D'où viennent les basaltes ?","answers":["Du refroidissement des laves","De la fonte des montagnes","De l'eau de mer"],"correct":0,"explanation":"Les basaltes proviennent du refroidissement des laves."},{"q":"Comment se disposent les basaltes ?","answers":["D'un seul côté","Au hasard","Symétriquement autour de l'axe"],"correct":2,"explanation":"Ils se disposent de façon symétrique par rapport à l'axe."},{"q":"Les chaînes de montagnes sont citées à quelles limites ?","answers":["Convergentes","Divergentes","Sans mouvement"],"correct":0,"explanation":"Le cours cite les chaînes de montagnes aux limites convergentes."},{"q":"Les fosses océaniques sont citées à quelles limites ?","answers":["Divergentes","Convergentes","Au centre des plaques"],"correct":1,"explanation":"Les fosses océaniques sont associées aux limites convergentes."},{"q":"Quelle affirmation décrit une dorsale ?","answers":["Deux plaques se rapprochent","Deux plaques s'écartent et de la matière minérale se forme","Aucun volcanisme ne se produit"],"correct":1,"explanation":"L'écartement et le volcanisme produisent de la matière minérale."},{"q":"Quelle suite respecte le cours ?","answers":["Refroidissement puis volcanisme puis écartement","Rapprochement puis formation du plancher","Écartement puis volcanisme puis refroidissement"],"correct":2,"explanation":"Le cours décrit l'écartement, le volcanisme effusif et le refroidissement des laves."}];
const endpoint="https://script.google.com/macros/s/AKfycbzoD_98amWd3F6lkHcly5hBJceJbAH1WN3dpsPPRhnJox-GQ9JV36KleaKPd0rdTqI/exec";
let index=0,score=0,first=true,answered=false,errors=[],started=0;
function startQuiz(){document.getElementById("start").hidden=true;started=Date.now();render();}
function render(){first=true;answered=false;document.getElementById("progress").textContent="Question "+(index+1)+" / "+questions.length;document.getElementById("question").textContent=questions[index].q;document.getElementById("feedback").textContent="";document.getElementById("next").hidden=true;const box=document.getElementById("answers");box.innerHTML="";questions[index].answers.map((text,i)=>({text,i})).sort(()=>Math.random()-.5).forEach(o=>{let b=document.createElement("button");b.textContent=o.text;b.onclick=()=>choose(b,o.i);box.appendChild(b);});}
function choose(btn,choice){if(answered||btn.disabled)return;let item=questions[index];if(choice===item.correct){answered=true;btn.className="good";if(first)score++;document.getElementById("feedback").textContent="🎉 Bravo Lina ! "+item.explanation;document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);let next=document.getElementById("next");next.hidden=false;next.textContent=index===questions.length-1?"🏆 Voir mon résultat":"Question suivante ➜";}else{if(first)errors.push({question:item.q,reponseDonnee:item.answers[choice],bonneReponse:item.answers[item.correct]});first=false;btn.disabled=true;btn.className="bad";document.getElementById("feedback").textContent="💪 Essaie encore, tu peux y arriver !";}}
function nextQuestion(){index++;if(index<questions.length){render();return;}document.getElementById("progress").textContent="Contrôle terminé";document.getElementById("question").textContent="🏆 Résultat : "+score+" / "+questions.length;document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent=score===10?"🌟 Excellent, Lina !":"Bravo Lina ! Revois les explications pour progresser.";document.getElementById("next").hidden=true;const payload={id:"lina_svt_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),matiere:"SVT — Reliefs aux frontières des plaques",note:score,total:questions.length,dureeMinutes:Math.round((Date.now()-started)/60000),erreurs:errors};let status=document.getElementById("status");status.textContent="📨 Transmission du résultat en cours…";fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>status.textContent="📧 Demande d'envoi effectuée. Vérifiez Gmail : la réception ne peut pas être confirmée ici.").catch(()=>status.textContent="⚠️ Envoi impossible. Vérifiez la connexion.");}
</script></body></html>
